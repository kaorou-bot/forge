name: forge-community-relay
services:
  relay:
    build: .
    restart: unless-stopped
    read_only: true
    tmpfs: ["/tmp:size=64m"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 768m
    ports:
      - "127.0.0.1:36745:36745"
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
  tls:
    image: nginx:stable
    restart: unless-stopped
    depends_on: [relay]
    ports:
      - "${FORGE_TLS_PORT:-443}:443"
    volumes:
      - ./state/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./state/letsencrypt:/etc/letsencrypt:ro
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
  certbot:
    image: certbot/certbot
    profiles: [tools]
    ports: ["80:80"]
    volumes:
      - ./state/letsencrypt:/etc/letsencrypt
      - ./state/certbot-work:/var/lib/letsencrypt
      - ./state/certbot-logs:/var/log/letsencrypt
