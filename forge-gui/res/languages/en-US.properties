advModeStandardSummary=Mode: Standard\n\nYour starting deck is built from 2-3 Jumpstart packs of twenty cards each.\n\n
advDiffEasyStandard=On your currently selected difficulty, Easy, you will receive three jumpstart packs of your chosen color.
advDiffNormalStandard=On your currently selected difficulty, Normal, you will receive two jumpstart packs of your chosen color and one of an allied color.
advDiffHardStandard=On your currently selected difficulty, Hard, you will receive one jumpstart pack of your chosen color and one of an allied color.
advDiffInsaneStandard=On your currently selected difficulty, Insane, you will receive one jumpstart pack of your chosen color and one of an allied color.
advCannotDetermineStarterDeck=((Cannot determine starter deck based on custom difficulty settings))
advModeConstructedSummary=Mode: Constructed\n\nYou will receive a specific preconstructed deck based on your chosen color and difficulty.\n\n
advDiffEasyConstructed=On your currently selected difficulty, Easy, your deck will only contain your chosen color.
advDiffNormalConstructed=On your currently selected difficulty, Normal, your deck will contain your chosen color and one allied color.
advDiffHardConstructed=On your currently selected difficulty, Hard, your deck will contain your chosen color and one opposing color.
advDiffInsaneConstructed=On your currently selected difficulty, Insane, your deck will contain your chosen color and one opposing color.
advModePileSummary=Mode: Pile\n\nYou will receive a random pile of cards based on your chosen color and difficulty.\n\n
advDiffEasyPile=On your currently selected difficulty, Easy, your deck will only contain your chosen color and one allied color.
advDiffNormalPile=On your currently selected difficulty, Normal, your deck will contain your chosen color and two allied colors.
advDiffHardPile=On your currently selected difficulty, Hard, your deck will contain your chosen color and two allied colors.\n\n
advDiffInsanePile=On your currently selected difficulty, Insane, your deck will contain your chosen color and two allied colors.\n\n
advPileLessRareReward=You will receive less uncommon and rare cards than on Normal difficulty.
advModeChaosSummary=Mode: Chaos\n\nYou (and all enemies) will receive a random preconstructed deck.\n\nWarning: This will make encounter difficulty vary wildly from the developers' intent
advModeCustomGeneticSummary=Mode: Custom\n\nChoose your own preconstructed deck. Enemies can receive a random genetic AI deck (difficult).\n\nWarning: This will make encounter difficulty vary wildly from the developers' intent
advModeCustomSummary=Mode: Custom\n\nChoose your own preconstructed deck.
advModePreconSummary=Mode: Precon\n\nYou will receive a specific preconstructed deck. You can choose a random or a specific preconstructed deck from an edition of your choice.\n\n
advModeCommanderSummary=Mode: Commander\n\nYou will be given a preconstructed commander deck based on the chosen color theme to start the playthrough.\n\nGood luck on your quest of creating a coherent deck that can win consistently and defeat the bosses.
advModeCommanderPreconSummary=Mode: Commander Precon\n\nChoose a named commander preconstructed deck to start the playthrough.\n\nThis uses Commander deckbuilding and game rules, but lets you pick from the curated commander precon folder.
