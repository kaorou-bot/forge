questBazaar.stall.Banker.description=银行家的桌上摊着一本硕大的账簿，站在门外都能看得见。
questBazaar.stall.Bookstore.name=贝连书屋
questBazaar.stall.Bookstore.description=大小不一的典籍堆成一座座齐人高的书塔。
questBazaar.stall.Gear.name=绳与斧
questBazaar.stall.Gear.description=冒险者需要什么工具，这里就有什么——至少墙上的招牌是这么说的。
questBazaar.stall.Nursery.name=自然之力苗圃
questBazaar.stall.Nursery.description=上百种植物的气息交织在一起，汇成一股独特的清香。
questBazaar.stall.PetShop.name=百兽巢
questBazaar.stall.PetShop.description=这座宽敞的兽舍里，各种动物的叫声此起彼伏。
questBazaar.item.SLEIGHT.name=《手法秘诀·卷一》
questBazaar.item.SLEIGHT.description=书中详解了各种高难度的手法。\n\n效果：每局第一次调度不减少起手牌数量。
questBazaar.item.MAP.name=冒险者地图
questBazaar.item.MAP.description=这些古老的地图能让你的旅途少走许多弯路。\n\n效果：更频繁地获得冒险之旅挑战。
questBazaar.item.LUCKY_COIN.name=幸运硬币
questBazaar.item.LUCKY_COIN.description=据说这枚硬币会为持有者带来好运。\n\n效果：每场比赛后获得随机稀有牌的概率提高 15%。
questBazaar.item.ESTATES.name=地产
questBazaar.item.ESTATES.description=拥有土地的人，在当地总有几分话语权。\n\n效果：比赛获胜奖励增加 %d%%。\n效果：卡牌出售价格比例提高 %.2f%%。
questBazaar.item.ZEPPELIN.name=飞艇
questBazaar.item.ZEPPELIN.description=这艘舒适的飞艇能让远途旅行更加安全、快捷。\n\n效果：更频繁地获得冒险之旅挑战。\n效果：生命值 +3。\n效果：启用后刷新一组挑战；尝试一场挑战后可再次启用。
questBazaar.item.POUND_FLESH.name=血肉交易
questBazaar.item.POUND_FLESH.description=炼金师欢迎你为那款著名的灵药提供原料。\n不过要当心，你的身体可能会逐渐对药效产生抗性……\n\n效果：获得 %d 积分。\n代价：生命上限减少 1。
questBazaar.item.ELIXIR_OF_LIFE.name=生命灵药
questBazaar.item.ELIXIR_OF_LIFE.description=柜台后的小瓶冒着气泡，飘出咸甜交杂的气味。\n\n效果：生命上限增加 1。\n注意：使用 15 次后将不再生效。
questBazaar.item.CHARM_VIM.name=迅捷护符
questBazaar.item.CHARM_VIM.description=护符让你精力充沛，动作也轻快起来。\n\n效果：可将比赛赛制从三局两胜改为单局决胜。
questBazaar.item.CHARM.name=活力护符
questBazaar.item.CHARM.description=这枚护符能驱散战斗带来的疲惫。\n\n效果：可将比赛赛制从三局两胜改为五局三胜。
questBazaar.item.CASH_STAKES.name=赌注回购契约
questBazaar.item.CASH_STAKES.description=与卡牌商店签订契约，由商店向冒险之旅对手收购你输掉的赌注牌。\n\n效果：在赌注对局中输掉的牌，会在比赛结束后立即上架卡牌商店。
questBazaar.item.MEMBERSHIP_TOKEN.name=银行会员凭证
questBazaar.item.MEMBERSHIP_TOKEN.description=这枚凭证证明你的银行会员身份，让你在获胜后有更多补充包可供挑选。\n\n效果：获胜后，可选补充包增加一种。
questBazaar.pet.Plant.name=植物
questBazaar.pet.Plant.description=每场战斗开始时，这株青翠的植物都会陪在你身旁。\n用它抵挡凶猛的生物再合适不过。
