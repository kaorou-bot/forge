adv.vampirecastle_vampirecastle_grave_2.82.d.n5.text=你掀开棺盖，一只巨大的鼹鼠猛地蹿出来，看起来既烦躁又愤怒。
adv.vampirecastle_vampirecastle_grave_2.82.d.n6.name=打开棺材。
adv.vampirecastle_vampirecastle_grave_2.82.d.n7.name=该清理害虫了！
