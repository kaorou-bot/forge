adv.main_story_temple_of_liliana_town.224.d.n0.text=镇长终究没能一直躲着你。你穿过拥挤的人群，终于追上了他。
adv.main_story_temple_of_liliana_town.224.d.n2.name=攻击镇长
adv.main_story_temple_of_liliana_town.224.x.n0.text=你从镇长冰冷的手中掰出钥匙——这回，他算是又死了一次。钥匙到手，通往莉莲娜的路上已没剩下多少阻碍。
adv.main_story_temple_of_liliana_town.235.x.n0.text=已标记：档案室检查完毕。
