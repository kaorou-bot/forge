adv.main_story_temple_of_liliana_town.237.d.n0.text=沼泽北缘有一处异样的聚落。即使深入沼泽，也很少能看到如此多的夜行生物与邪术修习者聚集在同一处。
adv.main_story_temple_of_liliana_town.237.d.n1.text=前方有位衣着华贵的法师，腰间挂着一把大钥匙。看来镇长不难辨认。不过你刚靠近，他就认出了你，惊叫一声，显然无意留下来与你交谈。
adv.main_story_temple_of_liliana_town.237.d.n3.text=镇长消失在一团黑烟中，但你确信他仍在这一带。现在只需把他找出来。
