# Adventure map dialogue: stable map/object/node keys; no gameplay identifiers translated.
adv.aerie_aerie_0.92.d.n0.text=欢迎，'{'var=player_name'}'！看来你是来挑选我们这些好鸟儿的。你可真有眼光，山德拉其他商家的价格可都比不过我们！
adv.aerie_aerie_0.92.d.n1.text=我是鸟舍公会的雇员。我们是山德拉最大的鸟类育种组织之一，在各地设有几处这样的繁育场。我的工作是把鸟卖给像你这样热衷冒险的人。随便看看吧。
adv.aerie_aerie_0.92.d.n2.name=你是谁？
adv.aerie_aerie_0.92.d.n3.text=恐怕不行。公会非常看重我们历经数千年发展起来的育种技术，不希望竞争对手窥探。擅闯鸟舍的人会遭到守卫阻拦，连鸟也受过训练，会攻击不受欢迎的入侵者。
adv.aerie_aerie_0.92.d.n4.name=我能进鸟舍看看吗？
adv.aerie_aerie_0.92.d.n6.name=谢谢告知，再见。
adv.aerie_aerie_1.99.d.n0.text=铭文写着：未经许可者止步，前方有危险鸟类。
adv.cave_cave_dwarf.84.d.n0.text=铭文写着：禁止入内，内有死者。
adv.cave_cave_multilevel_cave_16BR3U.83.d.n0.text=一扇巨大的门挡住了去路。透过栅栏，你看见门后的房间里站着一个威严的身影。（需要集齐这座地下城的五块碎片才能开门。）
adv.cave_cave_multilevel_cave_16BR3U.83.d.n2.text=门锁已打开。
adv.cave_cave_multilevel_cave_16BR3U.83.d.n3.name=用五块碎片开锁。
adv.debug_map.52.d.n0.text=我是一扇大门。你好。
adv.debug_map.52.d.n1.name=好吧……
adv.debug_map.69.d.n0.text=别管我，我歇会儿。
adv.debug_map.69.d.n1.name=当然。
adv.debug_map.80.d.n0.text=我是精灵。平时干的都是精灵该干的事，比如抱抱树、保持美貌。
adv.debug_map.80.d.n1.name=确认
adv.debug_map.80.d.n10.name=等等，我开玩笑的！！！
adv.debug_map.80.d.n11.text=她哭着走了。你这个没良心的。
adv.debug_map.80.d.n12.name=伊莫库去哪了？
adv.debug_map.80.d.n13.name=抱歉……
adv.debug_map.80.d.n14.text=你懂我！这件物品拿去吧。
adv.debug_map.80.d.n15.name=挺酷的，绿皮老兄。
adv.debug_map.80.d.n16.name=谢了，兄弟。
adv.debug_map.80.d.n17.text=不客气。
adv.debug_map.80.d.n18.name=感谢你的祝福。
adv.debug_map.80.d.n19.name=竖起大拇指。
adv.debug_map.80.d.n2.text=乐意之至。
adv.debug_map.80.d.n20.text=给我一份财宝，我就赐你调试精灵的祝福。\n下一场战斗，你将额外获得 2 点生命，开局时场上有一个罗堰妖精。怎么样？
adv.debug_map.80.d.n21.name=有什么厉害的精灵祝福吗？
adv.debug_map.80.d.n22.name=可我舍不得自己的财宝，恕我拒绝。
adv.debug_map.80.d.n23.name=我要了。
adv.debug_map.80.d.n24.text=既然你这么客气，我就帮你吧。
adv.debug_map.80.d.n25.name=你能打开那面暗墙吗？
adv.debug_map.80.d.n26.name=谢了，兄弟。
adv.debug_map.80.d.n27.text=啊，也许你能帮忙。替我问问调试恶魔最喜欢什么颜色，好吗？
adv.debug_map.80.d.n28.name=有任务吗？
adv.debug_map.80.d.n29.name=虽然有点怪，不过好吧。
adv.debug_map.80.d.n3.name=来战吧，精灵！
adv.debug_map.80.d.n30.name=那家伙太吓人了，还是算了。
adv.debug_map.80.d.n31.text=记得告诉我调试恶魔怎么回答。
adv.debug_map.80.d.n32.name=关于那个任务……
adv.debug_map.80.d.n33.name=当然。
adv.debug_map.80.d.n34.text=啊，原来如此。谢谢你，朋友。这点金币，就当是跑腿费。
adv.debug_map.80.d.n35.name=懂了，兄弟。
adv.debug_map.80.d.n36.name=多谢。
adv.debug_map.80.d.n4.name=喂，你这精灵是不是壮得有点过头了……？
adv.debug_map.80.d.n5.text=朋友，聆听森林的声音。\n你的标识色现在是绿色！
adv.debug_map.80.d.n6.name=我也想亲近自然。
adv.debug_map.80.d.n7.name=太棒了。
adv.debug_map.80.d.n8.text=真的？行吧……你自找的。\n喂，小伊！这家伙想陪你过两招！
adv.debug_map.80.d.n9.name=我要挑战那边的伊莫库！
adv.debug_map.80.x.n0.text=令人佩服……
adv.debug_map.80.x.n1.name=喂，你怎么还站着……？
adv.debug_map.81.d.n0.text=你……你伤了格罗格！\n你这肮脏的畜生！不看到你倒下，我绝不罢休！\n诸神啊……不管是谁！赐我力量！让我复仇！！！
adv.debug_map.81.d.n1.name=糟了。
adv.debug_map.82.d.n0.text=……
adv.debug_map.82.d.n1.name=？？？
adv.debug_map.83.d.n0.text=拿你身上的生命力来换，我倒有些东西可以给你……
adv.debug_map.83.d.n1.name=你鬼鬼祟祟的，还拖着两道影子。我先走了。
adv.debug_map.83.d.n10.name=我就喜欢你这股邪气。
adv.debug_map.83.d.n11.name=唉，真是的……
adv.debug_map.83.d.n12.text=这份财宝可以卖给你，公道价，200 金币。
adv.debug_map.83.d.n13.name=有什么不错的恶魔交易吗？
adv.debug_map.83.d.n14.name=这颗宝石棱角分明，和我一样锋芒毕露。成交！
adv.debug_map.83.d.n15.name=我再想想。
adv.debug_map.83.d.n16.text=把你的财宝给我……\n（生命值 +1，获得法术力视野，移动速度 120%，开局时场上有暗渊之王。）
adv.debug_map.83.d.n17.name=有什么厉害的恶魔祝福吗？
adv.debug_map.83.d.n18.name=听着不太正经。
adv.debug_map.83.d.n19.name=能出什么岔子呢？
adv.debug_map.83.d.n2.text=哟，瞧瞧，这里来了个硬汉！
adv.debug_map.83.d.n20.text=粉红色，我最爱的鲜血奶昔就是这个颜色。\n非常黑暗，非常邪恶。
adv.debug_map.83.d.n21.name=嘿，你最喜欢什么颜色？
adv.debug_map.83.d.n22.name=谢谢你，撒旦。
adv.debug_map.83.d.n3.name=恶魔，我要击败你！
adv.debug_map.83.d.n4.name=接招吧！
adv.debug_map.83.d.n5.text=你也能像我一样黑暗而凌厉。也许，拿一点生命力来换……
adv.debug_map.83.d.n6.name=我就喜欢你这股邪气。
adv.debug_map.83.d.n7.name=生命力可不行！没了它我会死的！
adv.debug_map.83.d.n8.name=反正留着也没别的用。
adv.debug_map.83.d.n9.text=你的生命力还不够……养足了再来。\n吃得健康点，读读书，让灵魂肥美些。
adv.debug_map.91.d.n0.text=咕噜。\n（根据你的《鱼语词典》，他在向你问好。）
adv.debug_map.91.d.n1.name=咕噜。
adv.debug_map.91.d.n2.text=咕噜。\n（你的标识色现在是蓝色。）
adv.debug_map.91.d.n3.name=我喜欢你这股鱼味。我也想变蓝，身上带点怪味。
adv.debug_map.91.d.n4.name=起作用了。哎呀，我现在真想吃点磷虾。
adv.debug_map.91.d.n5.text=咕噜，咕噜。\n（真有意思。）
adv.debug_map.91.d.n6.name=我跟那扇门聊过了。不知为何，我觉得这事对你有用。
adv.debug_map.91.d.n7.name=就是啊！
adv.emrakul_emrakul.71.d.n0.text=一道巨大的红色魔法屏障挡住了去路。
adv.emrakul_emrakul.71.d.n2.text=门锁已打开。
adv.emrakul_emrakul.71.d.n3.name=用奇怪的钥匙开锁。
adv.emrakul_wastetown.69.d.n0.text=你好，鹏洛客 '{'var=player_name'}'。这片区域仍在制作中，内容可能会调整。另外，这里的首领很强，请备好一副强力套牌。
adv.evilgrove_evilgrove_5_swamp.117.d.n0.text=铭文写着：因园区周边出现不速之客，永沼国家公园暂停对游客开放。
adv.fort_fort_colorless_2_wizards.73.d.n0.text=一道闪着微光的半透明红色屏障挡住去路。身后的房间里回荡着痛苦的尖叫。
adv.fort_fort_colorless_2_wizards.73.d.n2.text=屏障在你眼前消散得无影无踪。
adv.fort_fort_colorless_2_wizards.73.d.n3.name=把手放到屏障上。
