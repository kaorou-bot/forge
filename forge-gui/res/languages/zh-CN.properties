adv.vampirecastle_vampirecastle_grave_2.79.d.n0.text=你走近房间中央那口布满蛛网的棺材。
adv.vampirecastle_vampirecastle_grave_2.79.d.n2.text=你感觉到棺材中散发着巨大的力量，同时注意到，棺座周围刻满了亵渎的符号。
adv.vampirecastle_vampirecastle_grave_2.79.d.n3.name=仔细看看生锈的棺材。
adv.vampirecastle_vampirecastle_grave_2.79.d.n5.text=你掀开棺盖，一个强大的身影在幽暗中苏醒，以古老的声音怒吼：“渺小的凡人，你竟敢惊扰我的长眠？”
adv.vampirecastle_vampirecastle_grave_2.79.d.n6.name=打开棺材。
adv.vampirecastle_vampirecastle_grave_2.82.d.n0.text=你走近房间中央那口布满蛛网的棺材。
adv.vampirecastle_vampirecastle_grave_2.82.d.n2.text=你感觉到棺材中散发着巨大的力量，同时注意到，棺座周围刻满了亵渎的符号。
