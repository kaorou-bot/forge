adv.grove_grove_1_bears.86.d.n0.text=身后突然传来怪声，一个粗哑的声音轰然响起：“蜂蜜归我，你去死！”
adv.grove_grove_1_bears.86.d.n1.name=你有种不祥的预感。
adv.grove_grove_8_hydra.114.d.n0.text=前方有凶猛野兽！立刻回头！
adv.magetower_magetower_14_horrors.102.d.n0.text=一道门挡住去路，看起来要从别处打开。
adv.magetower_magetower_8_illusion.105.d.n0.text=这扇门锁着。不过，地上的刮擦痕迹表明它经常开启，钥匙很可能就在附近。
adv.magetower_magetower_8_illusion.105.d.n1.name=（离开）
adv.magetower_magetower_8_illusion.105.d.n2.text=门开了，你可以继续探索高塔。
adv.magetower_magetower_8_illusion.105.d.n3.name=用幻术师的钥匙打开大门。
