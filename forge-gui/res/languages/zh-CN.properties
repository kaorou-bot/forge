adv.main_story_temple_of_liliana_town.266.d.n0.text=门后站着传说中的莉莲娜，似乎正专心进行某种仪式。但想接近她，得先找到镇长。
adv.main_story_temple_of_liliana_town.282.d.n0.text=莉莲娜的仪式似乎即将完成。你看见她另一侧有一扇通往领地之外的传送门。
adv.main_story_temple_of_liliana_town.282.d.n1.text=你打开大门时，她的咒语恰好吟诵至高潮，传送门两侧成堆的尸体开始站起。必须阻止她，绝不能让这支亡灵大军涌入山德拉！
adv.main_story_templeofchandra.1.d.n0.text=不祥的黑门横亘在你与目标之间——也许门后等着的其实是厄运。润滑良好的齿轮将它牢牢锁住。
adv.main_story_templeofchandra.10.d.n0.text=墙上嵌着一个大开关——或者说，曾经嵌着。它似乎被熔化了，能做到这一点，温度想必高得惊人。
adv.main_story_templeofchandra.11.d.n0.text=这扇门似乎与西边的机器相连。
adv.main_story_templeofchandra.11.d.n1.name=现在得想办法启动它……
adv.main_story_templeofchandra.16.d.n0.text=墙上嵌着一个大开关——或者说，曾经嵌着。它似乎被熔化了，能做到这一点，温度想必高得惊人。
adv.main_story_templeofchandra.17.d.n0.text=这扇门似乎被某种机关锁住了，但附近看不到控制装置。
adv.main_story_templeofchandra.17.d.n1.name=该去找控制机关了！
adv.main_story_templeofchandra.18.d.n0.text=这扇门似乎被某种机关锁住了，但附近看不到控制装置。
adv.main_story_templeofchandra.18.d.n1.name=又得去找控制机关了……
adv.maze_maze_2.49.x.n0.text=对手发出刺耳的尖叫，重新化作石像，却已无法稳立于基座。雕像摔得粉碎，许多碎块滚入池中。你几乎敢发誓，水面之下，仍隐约传来那声尖叫。
adv.maze_maze_2.58.d.n0.text=身后突然传来怪声，一个古怪的声音嘶哑地喊道：“入侵者！这就是你最后的错误！”
adv.maze_maze_2.58.d.n1.name=你有种不祥的预感。
adv.minibosses_slime_hive.137.d.n0.text=铭文写着：山德拉下水道系统正在检修。少量绿色黏液污染了供水系统。情况已完全受控，下水道很快就能恢复使用。
adv.minibosses_wastetown.137.d.n0.text=铭文写着：山德拉下水道系统正在检修。少量绿色黏液污染了供水系统。情况已完全受控，下水道很快就能恢复使用。
adv.monastery_unhallowed_abbey_1F.85.d.n0.text=这扇门锁着。
adv.monastery_unhallowed_abbey_1F.85.d.n2.text=门锁已打开。
adv.monastery_unhallowed_abbey_1F.85.d.n3.name=用邪教徒的钥匙开锁。
adv.monastery_unhallowed_abbey_2F.113.d.n0.text=眼前高大威严的恶魔露出冷笑。\n“啊，你就是那个一直在释放我的祭品，还自愿来当新祭品的人吧。告诉我，凡人——在你的话语只剩痛苦哀嚎之前，说说你为何要挑战我？”
adv.monastery_unhallowed_abbey_2F.113.d.n1.text=恶魔露出讥笑。\n“啊，一位高尚的‘英雄’。我早该想到。力量耗尽时，你们这类人和其他人死得没什么两样——就让我示范给你看吧！”
adv.monastery_unhallowed_abbey_2F.113.d.n10.text=魔物眯起双眼。\n“怕得说不出话了？也罢，凡人。反正你都得死。”
adv.monastery_unhallowed_abbey_2F.113.d.n11.name=……
adv.monastery_unhallowed_abbey_2F.113.d.n2.name=因为你是个怪物，必须有人阻止你！
adv.monastery_unhallowed_abbey_2F.113.d.n4.text=恶魔低笑一声。\n“你的野心值得赞赏，脑子就算了。卖力点，我也许会让你顶替楼上那个被你干掉的废物。”
adv.monastery_unhallowed_abbey_2F.113.d.n5.name=我想要力量。你的残骸里有什么，我就取什么。
adv.monastery_unhallowed_abbey_2F.113.d.n7.text=恶魔惊讶地眨了眨眼，随即大笑。\n“好吧，既然你求的是这个，我就让你如愿以偿，而且远超你的预期。好好享受生命中最后一战吧，凡人。”
adv.monastery_unhallowed_abbey_2F.113.d.n8.name=说实话，我只是觉得你应该是个不错的对手。
adv.monastery_unhallowed_abbey_2F.97.d.n0.text=一道闪着微光的半透明红色屏障挡住去路。身后的房间里回荡着痛苦的尖叫。
adv.phyrexia_phyrexian_b1.62.d.n0.text=实验室后方的墙上伸出一个硕大而显眼的开关。
adv.phyrexia_phyrexian_b1.62.d.n1.text=身后传来金属相互摩擦的声音。
adv.phyrexia_phyrexian_b1.62.d.n2.name=扳动开关。
adv.phyrexia_phyrexian_b1.76.d.n0.text=这扇门锁着。这里别处一定有办法打开它。
adv.shared.chase=（追上他们！！！）
adv.shared.continue=继续
adv.shared.continue_paren=（继续）
adv.shared.continue_search=（继续搜索）
adv.shared.leave=离开
adv.shared.prepare=做好准备！
adv.shared.walk_away=离开。
adv.skep_skep_outer.100.d.n0.text=日安，冒险者！
adv.skep_skep_outer.101.d.n0.text=日安，冒险者。如你所见，这里的情况可不妙。
adv.skep_skep_outer.101.d.n1.text=不知为何，斯凯普巢穴的裂片妖突然变得凶暴，频频袭击山德拉各地的城镇。贾克哈尔德将军已经召集大军，准备处理此事。
adv.skep_skep_outer.101.d.n10.text=那些东西还在墙外爬来爬去，看来你还没完成任务？
adv.skep_skep_outer.101.d.n12.text=真没想到你能办成！按照约定，那件装备归你了。谢谢，冒险者。弟兄们，听好了！任务完成，那群东西的头领死了！咱们离开这个阴森地方。麦酒我请！
adv.skep_skep_outer.101.d.n13.name=裂片妖不再是威胁了。
adv.skep_skep_outer.101.d.n2.name=这里发生了什么？
adv.skep_skep_outer.101.d.n3.text=我们之前试过，可裂片妖实在太多。除了筑墙围住巢穴、防止周边村民再遭袭击以外，几乎毫无进展。
adv.skep_skep_outer.101.d.n4.name=所以你们打算直接攻进巢穴，然后听天由命？
adv.skep_skep_outer.101.d.n5.text=裂片妖拥有共同的群体意识。也就是说，只要设法除掉女后，其他裂片妖就不再是问题。可惜，我们还找不到愿意深入巢穴对付女后的勇士……
adv.skep_skep_outer.101.d.n6.name=处理裂片妖的事，有什么我能帮忙的吗？
adv.skep_skep_outer.101.d.n7.text=除了山德拉居民对你铲除这些可怕生物的感激，我还会送你一件上好的新护甲，助你今后冒险。解决裂片妖后，再回来领赏。我会让士兵打开大门，放你进入巢穴。祝你好运，冒险者！
adv.skep_skep_outer.101.d.n8.name=我可以对付裂片妖后，不过有什么好处？
adv.skep_skep_outer.101.d.n9.name=结束
adv.skep_skep_outer.150.d.n0.text=日安，冒险者！
adv.skep_skep_outer.151.d.n0.text=日安，冒险者！
adv.skep_skep_outer.238.d.n0.text=那些东西绝对过不了这扇门。冒险者，这点你可以放心。
adv.skep_skep_outer.239.d.n0.text=日安，冒险者！
adv.skep_skep_outer.240.d.n0.text=日安，冒险者！
adv.skep_skep_outer.241.d.n0.text=日安，冒险者！
adv.skep_skep_outer.242.d.n0.text=这扇门锁着。
adv.skep_skep_outer.242.d.n2.text=门锁已打开。
adv.skep_skep_outer.242.d.n3.name=用外门钥匙开锁。
adv.skep_skep_outer.250.d.n0.text=马兴致索然地看着你。
adv.skep_skep_outer.256.d.n0.text=一道闪着微光的半透明红色屏障挡住去路。身后的房间里回荡着奇怪的声音。
adv.skep_skep_outer.256.d.n2.name=红色屏障在你眼前消融。你可以继续前进了。
adv.skep_skep_outer.266.d.n0.text=要喂的嘴太多，没空闲聊。
adv.skep_skep_outer.266.d.n2.text=那些穿得花里胡哨的人都去哪了？有人说麦酒免费吗？
adv.skep_skep_outer.57.d.n0.text=受伤的裂片妖饶有兴趣地看着你。
adv.skep_skep_outer.57.d.n1.text=我是斯凯普巢穴的裂片妖后。至少，王位被夺走之前是。
adv.skep_skep_outer.57.d.n10.name=包在我身上。
adv.skep_skep_outer.57.d.n11.text=我……很虚弱。趁我还有最后一点力气……击败裂片妖后……
adv.skep_skep_outer.57.d.n13.text=谢……谢谢你，陌生人。我感觉力量正在慢慢恢复。按照约定，我会以女后的身份重新掌控裂片妖。山德拉的居民不必再惧怕斯凯普巢穴了。不过，冒险者，请记住：我的孩子仍会抵御一切擅闯巢穴的人。再见！
adv.skep_skep_outer.57.d.n14.name=裂片妖后已被击败！
adv.skep_skep_outer.57.d.n2.name=你是什么？
adv.skep_skep_outer.57.d.n3.text=几千年来，我一直照料斯凯普巢穴的裂片妖，让它们安然繁衍、保持温顺，不去袭击外人。裂片妖后攻来并夺取巢穴后，一切都变了。如你所见，我没能击败她。
adv.skep_skep_outer.57.d.n4.name=被夺走了王位？怎么回事？
adv.skep_skep_outer.57.d.n5.text=没错，她正从多元宇宙各处召集裂片妖，组建大军。用不了多久，她就会拥有足以征服整个山德拉的兵力。
adv.skep_skep_outer.57.d.n6.name=所以，是裂片妖后让斯凯普巢穴的裂片妖变得这么凶暴？
adv.skep_skep_outer.57.d.n7.text=我很欣赏你的热情，但裂片妖后可不是能轻易对付的敌人。首先，你得击败分散在斯凯普巢穴里的三名副官。只有这样，魔法护盾才会消失，你才能进入她的巢室。
adv.skep_skep_outer.57.d.n8.name=她在哪？我去解决。
adv.skep_skep_outer.57.d.n9.text=解决裂片妖后，再回来找我。等我重掌山德拉的裂片妖巢穴，我保证斯凯普的裂片妖不再危害当地居民。还有，拿着这块母巢石。它能让你的生物也成为裂片妖，扰乱裂片妖后的判断。
adv.skep_skep_outer.73.d.n0.text=要喂的嘴太多，没空闲聊。
adv.skep_skep_outer.74.d.n0.text=铭文写着：陌生人，请告诉我们的同胞，我们长眠于此，至死不曾放弃抵抗裂片妖的侵袭。
adv.skep_skep_outer.93.d.n0.text=日安，冒险者！
adv.skep_skep_outer.99.d.n0.text=日安，冒险者！
adv.snowabbey_snowabbey_1.78.d.n0.text=铭文写着：欢迎来到哈兰渔村。
adv.tibalt_tibalt_f0.189.d.n0.text=你走近时，城堡的大门吱呀开启，露出一座漆黑的庭院，四下一片令人不安的寂静。脚下的大地冰冷而坚硬，仿佛也在畏惧提勃的领地。狰狞的石像鬼从城墙上俯视着你，在渐暗的光线中，扭曲的身形仿佛活了过来。
adv.tibalt_tibalt_f1.136.x.n0.text=魔鬼尖叫着倒地，鲜血与受害者的血混在一起。红色屏障随之消失，通往上层的道路打开了。
adv.tibalt_tibalt_f1.217.d.n0.text=一道闪着微光的半透明红色屏障挡住去路。这片墓穴中潜伏着古老的邪恶力量，阻止你进入眼前的房间……
adv.tibalt_tibalt_f2.119.x.n0.text=独眼巨人尖叫着倒地，鲜血与受害者的血混在一起。红色屏障随之消失，通往提勃的道路打开了。
adv.tibalt_tibalt_f2.200.d.n0.text=一道闪着微光的半透明红色屏障挡住去路。这片墓穴中潜伏着古老的邪恶力量，阻止你进入眼前的房间……
adv.tibalt_tibalt_f3.119.x.n0.text=拷问者尖叫着倒地，鲜血与饱受折磨的受害者的血混在一起。红色屏障随之消失，通往提勃房间的道路打开了。
adv.tibalt_tibalt_f3.201.d.n0.text=一道闪着微光的半透明红色屏障挡住去路。这片墓穴中潜伏着古老的邪恶力量，阻止你进入眼前的房间……
adv.tibalt_tibalt_f3.204.d.n0.text=这扇门锁着。
adv.tibalt_tibalt_f3.204.d.n2.text=门锁打开了，但钥匙在开门时折断了。
adv.tibalt_tibalt_f3.204.d.n3.name=用拷问者的钥匙开锁。
adv.tibalt_tibalt_f4.168.d.n0.text=这扇门锁着。
adv.tibalt_tibalt_f4.168.d.n2.text=门锁已打开。
adv.tibalt_tibalt_f4.168.d.n3.name=用提勃的钥匙开锁。
adv.tibalt_tibalt_f4.176.d.n0.text=低沉而幽怨的旋律从不知名处传来，仿佛墙壁本身也在回响，令这片空间更添不祥。奇异的器具与奥术遗物散落室内，无声地展示着提勃对黑暗魔法的掌控。
adv.towns_plains_town.53.d.n0.text=我是一扇大门。你好。
adv.towns_plains_town.53.d.n1.name=好吧……
adv.vampirecastle_vampirecastle_4.82.d.n0.text=一扇巨大的门挡住了去路。透过栅栏，你看见门后的房间里站着一个威严的身影。
adv.vampirecastle_vampirecastle_4.82.d.n2.text=门锁已打开。
adv.vampirecastle_vampirecastle_4.82.d.n3.name=用钥匙开锁。
adv.vampirecastle_vampirecastle_4.98.d.n0.text=可怜的农夫在你面前瑟瑟发抖。
adv.vampirecastle_vampirecastle_4.98.d.n1.text=谢……谢谢您。请收下这件物品，聊表谢意。
adv.vampirecastle_vampirecastle_4.98.d.n2.name=索霖已经被解决，你自由了。
adv.vampirecastle_vampirecastle_4.98.d.n3.name=（拿走挑战币）
adv.vampirecastle_vampirecastle_grave_1.62.d.n0.text=墓室中央静卧着一口棺材。这件吸血鬼历史的遗物，曾承载不死者，如今饱经岁月侵蚀，默默见证着其中的秘密与阴影。它仿佛收纳了数百年时光，既阴森又凄凉，守望着夜之国度的谜团。
adv.vampirecastle_vampirecastle_grave_1.62.d.n2.text=你感觉到棺材中散发着巨大的力量，同时注意到，棺座周围刻满了亵渎的符号。
adv.vampirecastle_vampirecastle_grave_1.62.d.n3.name=仔细看看生锈的棺材。
adv.vampirecastle_vampirecastle_grave_1.62.d.n5.text=你掀开棺盖，一个强大的身影在幽暗中苏醒，以古老的声音怒吼：“渺小的凡人，你竟敢惊扰我的长眠？”
adv.vampirecastle_vampirecastle_grave_1.62.d.n6.name=打开棺材。
adv.vampirecastle_vampirecastle_grave_1.63.d.n0.text=一道闪着微光的半透明红色屏障挡住去路。这片墓穴中潜伏着古老的邪恶力量，阻止你进入眼前的房间……
adv.vampirecastle_vampirecastle_grave_2.100.d.n0.text=你走近房间中央那口布满蛛网的棺材。
adv.vampirecastle_vampirecastle_grave_2.100.d.n2.text=你感觉到棺材中散发着巨大的力量，同时注意到，棺座周围刻满了亵渎的符号。
adv.vampirecastle_vampirecastle_grave_2.100.d.n3.name=仔细看看生锈的棺材。
adv.vampirecastle_vampirecastle_grave_2.100.d.n5.text=你掀开棺盖，原以为会有古老的邪物从中扑出，结果发现那股不祥之感不过是自己的想象。
adv.vampirecastle_vampirecastle_grave_2.100.d.n6.name=打开棺材。
adv.vampirecastle_vampirecastle_grave_2.100.d.n7.name=拿走空棺里的战利品。
