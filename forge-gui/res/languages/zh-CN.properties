adv.main_story_castles_black_castle_f1.50.x.n0.text=当你给棘泽边最后一击时，一阵强烈的法术力波动掠过全身。
adv.main_story_castles_black_castle_f1.50.x.n2.text=当你给棘泽边最后一击时，又一阵法术力波动传来。
adv.main_story_castles_black_castle.55.d.n0.text=你来到那扇门前。
adv.main_story_castles_black_castle.55.d.n1.text=一阵黑风卷过，大门碎成千片。你可以通行了。
adv.main_story_castles_black_castle.55.d.n2.name=棘泽边，我已经照你说的做了！该结束这一切了！
adv.main_story_castles_black_castle.55.d.n4.text=一阵黑风卷过，大门碎成千片。你可以通行了。
adv.main_story_castles_black_castle.55.d.n5.name=棘泽边，我已经照你说的做了！该结束这一切了！
adv.main_story_castles_black_castle.55.d.n7.text=你还不够格，退下！
adv.main_story_castles_black_castle.55.d.n8.name=敲门。
adv.main_story_castles_black_castle.73.d.n0.text=欢迎，'{'var=player_name'}'。棘泽边早已迫不及待地等着这一刻了。
adv.main_story_castles_black_castle.73.d.n1.text=恐怕我无权这么做。我只是强大的恶魔之主棘泽边的一名仆从。
adv.main_story_castles_black_castle.73.d.n2.name=是吗？那想必你不介意帮我打开眼前这扇门吧？
adv.main_story_castles_black_castle.73.d.n3.text=击败潜伏在这座地下城里的五名敌人中的至少四名，证明你的实力，才有资格觐见我伟大的主人。\n磨利武器，备好咒语，鼓起勇气。前方的考验，即使是身经百战的勇士也不能轻视。
adv.main_story_castles_black_castle.73.d.n4.name=我要怎样才能通过这扇门？
adv.main_story_castles_black_castle.73.d.n6.name=我会证明自己的实力。等我击败你的挑战者，你可要记得开门。
adv.main_story_castles_black_castle.73.d.n7.text=挑战者尚未被击败，你不得越过此门。
adv.main_story_castles_black_castle.73.d.n9.text=真令人刮目相看。你可以上楼去见我的主人了，不过我可不保证你能活着回来。
adv.main_story_castles_blue_castle_f1.50.x.n0.text=当你给罗佐司最后一击时，一阵强烈的法术力波动掠过全身。眼前的威胁消除后，你终于看清：大厅北端那间上锁的房间里，没有任何囚徒。
adv.main_story_castles_blue_castle_f1.50.x.n2.text=当你给罗佐司最后一击时，又一阵法术力波动传来。但和之前一样，倒下的敌人身后，那间上锁的房间里没有任何囚徒。
adv.main_story_castles_blue_castle.55.d.n0.text=你来到一扇门前。
adv.main_story_castles_blue_castle.55.d.n1.text=大门忽然在你眼前消失，前路畅通了。
adv.main_story_castles_blue_castle.55.d.n2.name=罗佐司，我已经照你说的做了！该结束这一切了！
adv.main_story_castles_blue_castle.55.d.n4.text=大门忽然在你眼前消失，前路畅通了。
adv.main_story_castles_blue_castle.55.d.n5.name=罗佐司，我已经照你说的做了！该结束这一切了！
adv.main_story_castles_blue_castle.55.d.n7.text=你还不够格，退下！
adv.main_story_castles_blue_castle.55.d.n8.name=敲门。
adv.main_story_castles_blue_castle.85.d.n0.text=欢迎，'{'var=player_name'}'。罗佐司早已迫不及待地等着这一刻了。
adv.main_story_castles_blue_castle.85.d.n1.text=恐怕我无权这么做。我只是强大的深海主宰罗佐司的一名仆从。
adv.main_story_castles_blue_castle.85.d.n2.name=是吗？那想必你不介意帮我打开眼前这扇门吧？
adv.main_story_castles_blue_castle.85.d.n3.text=击败潜伏在这座地下城里的五名敌人中的至少四名，证明你的实力，才有资格觐见我伟大的主人。\n磨利武器，备好咒语，鼓起勇气。前方的考验，即使是身经百战的勇士也不能轻视。
