adv.vampirecastle_vampirecastle_grave_3.66.d.n0.text=一道闪着微光的半透明红色屏障挡住去路。这片墓穴中潜伏着古老的邪恶力量，阻止你进入眼前的房间……
adv.vampirecastle_vampirecastle_grave_3.67.d.n0.text=墓室中央静卧着一口棺材。这件吸血鬼历史的遗物，曾承载不死者，如今饱经岁月侵蚀，默默见证着其中的秘密与阴影。它仿佛收纳了数百年时光，既阴森又凄凉，守望着夜之国度的谜团。
adv.vampirecastle_vampirecastle_grave_3.67.d.n2.text=你感觉到棺材中散发着巨大的力量，同时注意到，棺座周围刻满了亵渎的符号。
adv.vampirecastle_vampirecastle_grave_3.67.d.n3.name=仔细看看生锈的棺材。
adv.vampirecastle_vampirecastle_grave_3.67.d.n5.text=你掀开棺盖，一个强大的身影在幽暗中苏醒，以古老的声音怒吼：“渺小的凡人，你竟敢惊扰我的长眠？”
adv.vampirecastle_vampirecastle_grave_3.67.d.n6.name=打开棺材。
adv.zedruu_zedruu_f0.223.d.n0.text=这扇门锁着。
adv.zedruu_zedruu_f0.223.d.n2.text=门锁已打开。
adv.zedruu_zedruu_f0.223.d.n3.name=用地下室钥匙开锁。
adv.zedruu_zedruu.217.d.n0.text=这扇门锁着。
adv.zedruu_zedruu.217.d.n2.text=门锁已打开。
adv.zedruu_zedruu.217.d.n3.name=用外门钥匙开锁。
adv.common.extra.80=机器轰然倒地，散成一堆零件。几根杠杆和一些齿轮从金属外壳中脱落出来。
adv.common.extra.138=满心欢喜地走向奖品。
adv.common.extra.226=也许在别处能派上用场？
adv.common.extra.273=铭文写着：恭喜你，冒险者！只要找到这里，就能获得一份奖品！
adv.common.extra.381=一股神秘力量将你向后推去，无论多么努力也无法前进。你脑海中浮现出一位天使拦路的幻象。
adv.common.unkeyed.2=中央传来一阵巨响。
adv.common.unkeyed.3=东边传来一阵巨响。
adv.common.unkeyed.4=南边传来隆隆声与一阵骚动。最后一道门似乎打开了。
adv.common.unkeyed.5=电线从这个开关一直连到旁边的发电机。
adv.common.unkeyed.6=相连的机器嗡鸣着启动，你东侧的大门打开了。
adv.common.unkeyed.7=又见面了，鹏洛客 '{'var=player_name'}'。
adv.common.unkeyed.8=知道了，知道了，击败茜卓，对吧。
adv.common.unkeyed.9=你已经将传奇鹏洛客茜卓从囚禁中解救出来……
adv.common.unkeyed.10=好吧，我想起来了。
adv.common.unkeyed.11=我做到了，就像你要求的那样。
adv.common.unkeyed.12=……但她的心智仍被囚禁。
adv.common.unkeyed.13=所以……接下来呢？
adv.common.unkeyed.14=击败茜卓，我便能帮助她恢复，让她在今后的战斗中助你一臂之力。切记，'{'var=player_name'}'，这项任务非常艰难。
adv.common.unkeyed.15=谢谢提醒。
adv.common.unkeyed.16=片刻后，你感觉周围的能量发生了变化。墓地围栏上那层朦胧的微光消散了，视野边缘开始有身影移动。看来，关于守护者在此地的作用，传闻确有几分真实。
adv.common.unkeyed.17=与身后的森林相比，墓地安静得令人发毛。静得你仿佛能听见周围石墙传来微弱的嗡鸣。
adv.common.unkeyed.18=仔细看看石墙。
adv.common.unkeyed.19=你很快找到了声音的来源：一道朦胧的魔法微光从墙顶延伸开来，似乎是为了将某些东西挡在墓地外——或者关在里面。
adv.common.unkeyed.20=寻找魔法的源头。
adv.common.unkeyed.21=你没看出法术从何而来，却注意到附近有一块与周围墓碑不同的石牌。
adv.common.unkeyed.22=阅读铭文。
adv.common.unkeyed.23=“长眠于此的存在，无法放逐，只能禁锢。我守望此地，使邪灵与它们的凡躯分离。”文字旁刻着天使与暗灵在空中交战的图案。
adv.common.unkeyed.24=（搜索墓地）
adv.common.unkeyed.25=施法辨认这道魔法。
adv.common.unkeyed.26=法术力的丝线在墙上方交织，也伸入石块之中。那些游离的线头似乎都指向东北方。你还发现附近一块石牌上附着微弱的魔法。
adv.common.unkeyed.27=阅读石牌。
adv.common.unkeyed.28=又见面了，鹏洛客 '{'var=player_name'}'。
adv.common.unkeyed.29=知道了，知道了，击败莉莲娜，对吧。
adv.common.unkeyed.30=你已经将传奇鹏洛客莉莲娜从囚禁中解救出来……
adv.common.unkeyed.31=击败莉莲娜，我便能帮助她恢复，让她在今后的战斗中助你一臂之力。切记，'{'var=player_name'}'，这项任务非常艰难。
adv.common.unkeyed.32=我身后的传送门通往她领地的各处。激活之后，你就能借助它们更快地穿行。
adv.common.unkeyed.33=女巫败下阵来，彻底松开法杖，最后几道咒语也随之消散。“等等……放我走，我保证不惊动别人。”
adv.common.unkeyed.34=听她说下去。
adv.common.unkeyed.35=“……这些蘑菇用得巧就能毒死人，不过剂量合适的话，也许能用来疗伤。”她停顿片刻，似乎在想，自己眼下就需要试试。
adv.common.unkeyed.36=相信她的话。
adv.common.unkeyed.37=她抓起一把蘑菇，捣碎后放进装有不明液体的小瓶中，喝了一口，再慢慢把瓶子放到地上留给你，随后匆匆离去。（恢复生命值 +10）
adv.common.unkeyed.38=结束她的性命。
adv.common.unkeyed.39=她已经无力继续反抗。你在她身上找到一把可疑的蘑菇和一些金币。（金币 +250）
adv.common.unkeyed.40=放她离开。
adv.common.unkeyed.41=她低下头，连忙逃走，把法杖留在原地。
adv.common.unkeyed.42=（继续）
adv.common.unkeyed.43=翻看物品。
adv.common.unkeyed.44=没什么值得注意的东西，不过你找到一把硕大而结实的钥匙。
adv.common.unkeyed.45=追赶僧侣。
adv.common.unkeyed.46=等你赶到，建筑已经锁得严严实实。手中的钥匙远比锁孔大。
adv.common.unkeyed.47=离开这一带。
adv.common.unkeyed.48=追上他们。
adv.common.unkeyed.49=你还没追上，他就关上了那扇精巧的石门。你甚至还没找到门把手，便听见接连几声沉重的咔哒声，门已经锁死。
adv.common.unkeyed.50=搜查物品。
adv.common.unkeyed.51=除了一把大金属钥匙，你没找到任何值钱的东西。赶回门边后，你很快发现，这把钥匙比门上的锁孔大得多。
adv.common.unkeyed.52=仔细看看石墙。
adv.common.unkeyed.53=路边有一座喷泉。石砌结构污脏而破损，泉水却出奇地清澈干净。
adv.common.unkeyed.54=一截人鱼尾巴的残骸，以残酷的方式证实了商人的讲述。确实有一位水中居民远离故土来到这里，而它再也回不去了。
adv.common.unkeyed.55=不过，调查得先等等了——死因似乎已经显而易见。恶魔不知从何处冒出，正从四面八方向你冲来。
adv.common.unkeyed.56=快跑！！！
adv.common.unkeyed.57=残破的墙后露出一组齿轮，但眼前的杠杆只能空转。
adv.common.unkeyed.58=相连的机器嗡鸣着启动，你东边的一间密室打开了！
adv.common.unkeyed.59=将魔像身上的齿轮装到杠杆上。
adv.common.unkeyed.60=残破的墙后露出一组齿轮，却看不出该怎样让它们转动。
adv.common.unkeyed.61=古老的齿轮相互研磨，脚下的地面开始震动，除此之外却没有明显变化。
adv.common.unkeyed.62=将魔像身上的杠杆装到齿轮上。
adv.common.unkeyed.63=并非所有植物都长得好。这一株似乎被动物啃过，你甚至看不出它原来的花色。
adv.common.unkeyed.64=一名囚徒被绑在祭坛上，周围环绕着发光的红色符文。
adv.common.unkeyed.65=第三名囚徒获救时，厅堂中央的屏障轰然碎裂。该结束这一切了。
adv.common.unkeyed.66=释放囚徒。
adv.common.unkeyed.67=确认
adv.common.unkeyed.68=恶魔痛苦地咆哮着倒地。\n“恭喜，凡人，你赢了。饶我一命，我就传你一招——正是我所掌握的杀戮之力。”
adv.common.unkeyed.69=我不需要你这种卑劣东西的力量。受死吧！
adv.common.unkeyed.70=恶魔惊恐地瞪大双眼。\n“不！我绝不会被——”\n最后一击将它化为逸散的法术力，有什么东西叮当落地。那是此地的圣徽——准确地说，是此地尚且神圣时的象征。邪恶能量渐渐消退，你仍能感觉到其中流动的魔力。
adv.common.unkeyed.71=你若真有什么高明本事可以传授，我也不会打赢你了。
adv.common.unkeyed.72=……也罢，哪怕你这样的怪物，也值得一次宽恕。仅此一次。
adv.common.unkeyed.73=恶魔微笑着做了个神秘的手势。\n你不自觉地模仿，一股黑暗而令人厌恶的力量在手中凝聚成形。\n它笑着化为一团烟雾，渐渐消散。\n“很好，凡人。我的力量归你运用了……后会有期。”
adv.common.unkeyed.74=这还差不多。我接受。
adv.common.unkeyed.75=我是盖布拉许·崔普伍德，我想当海盗！
adv.common.unkeyed.76=我是盖布拉许·崔普伍德，我想当消防员！
adv.common.unkeyed.77=我是盖布拉许·崔普伍德，我在卖这些上好的皮夹克。
adv.common.unkeyed.78=我是盖布拉许·崔普伍德，我这就走。

# Realm capitals and Old Border palace/temple dialogue (Round27).
adv.oldborder.plot.000=约格莫夫，你的守卫已经倒下！该做个了断了！
adv.oldborder.plot.001=欢迎你，'{'var=player_name'}'。我的黑暗之主，机械之父约格莫夫，早已迫不及待地等着这一刻。
adv.oldborder.plot.002=恐怕我无权放行。我不过是强大的约格莫夫麾下的一名仆役，而他统治着非瑞克西亚和一切亵渎之物。
adv.oldborder.plot.003=要证明你有资格觐见我那统御黑暗国度的伟大主人，就必须击败潜伏在这座诅咒宫殿里的四名副将。磨利刀刃，备好咒语，鼓起勇气吧。前方的考验，即使身经百战的勇士也未必经受得住。
adv.oldborder.plot.004=我会证明自己。等我击败这些对手，你可别忘了开门。
adv.oldborder.plot.005=克撒，你的守卫已经败了！该做个了断了！
adv.oldborder.plot.006=大门突然在你眼前消失，道路已畅通无阻。
adv.oldborder.plot.007=欢迎你，'{'var=player_name'}'。强大的鹏洛客克撒正等着你的挑战。
adv.oldborder.plot.008=我准备好了，需要做什么？
adv.oldborder.plot.009=克撒最信任的四位盟友守着通往他的道路。他们本身也都是强大的巫师和神器师。
adv.oldborder.plot.010=也就是说，击败他们就能过去？
adv.oldborder.plot.011=正是。届时，你才有资格面对我伟大的主人。\n磨利刀刃，备好咒语，鼓起勇气吧。前方的考验，即使身经百战的勇士也未必经受得住。
adv.oldborder.plot.012=我会证明自己。等我击败守卫，你可别忘了开门。
adv.oldborder.plot.013=盖亚，我已击败你的守卫！该做个了断了！
adv.oldborder.plot.014=伴着震耳欲聋的轰鸣，大门骤然炸开，前路只余灰烬。你可以通行了。
adv.oldborder.plot.015=欢迎你，'{'var=player_name'}'。多明纳里亚的世界之魂盖亚，早已预见你的到来。
adv.oldborder.plot.016=是吗？我要接受什么考验？
adv.oldborder.plot.017=盖亚最忠诚的四名仆从，守着通往她的道路。
adv.oldborder.plot.018=所以，我得击败他们？
adv.oldborder.plot.019=是的。击败他们后，你就能直面盖亚——统御并塑造万物自然的存在。\n磨利刀刃，备好咒语，鼓起勇气吧。前方的考验，即使身经百战的勇士也未必经受得住。
adv.oldborder.plot.020=雅亚，我已击败你的守卫！该做个了断了！
adv.oldborder.plot.021=欢迎你，'{'var=player_name'}'。传奇人物雅亚巴拉德，早就盼着这一刻了。
adv.oldborder.plot.022=不行。还没证明本事就大摇大摆闯进去，雅亚女士可不会高兴。
adv.oldborder.plot.023=那我要怎么证明？
adv.oldborder.plot.024=她哄了四位强大的战士替她守门。打败他们，雅亚就会乐呵呵地把你活活烧死。
adv.oldborder.plot.025=看来你把主人的毒舌学得不错。等我打败这些对手，你记得开门就行。
adv.oldborder.plot.026=撒拉，我已击败你的守卫！该做个了断了！
adv.oldborder.plot.027=欢迎你，'{'var=player_name'}'。伟大的善心撒拉，早已预见你的到来。
adv.oldborder.plot.028=是吗？既然她如此仁慈，不如放我过去？
adv.oldborder.plot.029=恐怕不行，毕竟你是来向她挑战的。
adv.oldborder.plot.030=我要怎么做，才能通过这道门？
adv.oldborder.plot.031=想证明自己有资格，你必须击败她的四位神圣守卫。\n磨利刀刃，备好咒语，鼓起勇气吧。前方的考验，即使身经百战的勇士也未必经受得住。
adv.oldborder.plot.037=*洪水荷马利缓缓咕噜着，像是在打招呼，双螯有节奏地耐心开合。*
adv.oldborder.plot.038=*维塞里奴兽侧身疾走，口器敲出急促而兴奋的节奏。*
adv.oldborder.plot.039=*维塞里奴兽轻轻咔哒着，绕你一圈，又返回了岗位。*
adv.oldborder.plot.040=河流人鱼指向下游。“一只洪水荷马利筑坝拦河，淹没了下游地区。去对付那只大甲壳怪，让它放弃对堤坝的控制。”
adv.oldborder.plot.041=“我们会疏通河道。”
adv.oldborder.plot.042=“先顾主战场。”
adv.oldborder.plot.043=河流人鱼望着下游暴涨的河水。“荷马利还占着堤坝。把它赶走，河流才能重新畅通。”
adv.oldborder.plot.044=河流人鱼感激地向你致意。“河水又能自由流淌了。神殿会记住，是谁打破了荷马利的封锁。”
adv.oldborder.plot.045=河流人鱼放低海螺号角，向你致意。“神殿屹立不倒，佣兵。潮汐自会铭记。”
adv.oldborder.plot.046=“深海新捞上来的好货，佣兵！离海这么远，可找不到比我更实惠的价钱。”
adv.oldborder.plot.047=*齿轮嘎嘎作响，战争机械的船员架起投石臂，又从船舷旁向你致意。*
adv.oldborder.plot.048=“深渊呼唤深渊，佣兵。神殿的歌声既约束潮汐，也约束我们的敌人。”
adv.oldborder.plot.049=“深渊呼唤深渊，佣兵。与我们同唱，潮水自会托起你。”
adv.oldborder.plot.050=“奋勇作战吧，佣兵。潮汐会将你的名字传遍海岸。”
adv.oldborder.plot.051=“风暴呼啸时，捂好耳朵，佣兵。我的雷霆可不分敌我。”
adv.oldborder.plot.052=“我施法时退远些，佣兵。希亚尔军的风暴虽会挑目标，却未必会避开你。”
adv.oldborder.plot.053=“气泡告诉我，你打得不错，佣兵。别挡着我的潮水，我们就能相安无事。”
adv.oldborder.plot.054=*深渊魔裔鼓动着身躯，咕噜作响。几只眼睛转向你，随后它又缓缓巡游起来。*
adv.oldborder.plot.055=*深渊魔裔发出低缓绵长的咕噜声，像是在问候。它庞大的身躯漂过，仿佛一块移动的水下礁石。*
adv.oldborder.plot.056=“和我们一同守住防线，佣兵。只要我们还站着，荷马利就休想踏过这里。”
adv.oldborder.plot.057=“躲在我的盾后，佣兵。神殿不会失守。”
adv.oldborder.plot.058=“女祭司说过，潮水会带来援军。它带来了你，也行。”
adv.oldborder.plot.059=“警醒些，佣兵。潮势一变，荷马利的攻势就会凶猛起来。”
adv.oldborder.plot.060=“让刀锋沾血，让双脚远离海水，佣兵。”
adv.oldborder.plot.061=“又来一个佣兵？好。上一个走的时候，身上的窟窿可比来时多。”
adv.oldborder.plot.062=“我们守住这座大厅。盯紧水面，佣兵——他们会从下面上来。”
adv.oldborder.plot.063=*咔哒，咔哒，咔哒* 绿色荷马利朝远岸挥了挥螯，又继续巡逻。
adv.oldborder.plot.064=*紫色荷马利咔哒两声，敲打着自己的甲壳，得意地发出一阵脆响。*
adv.oldborder.plot.065=*红色荷马利嘶嘶地吐出一串气泡，对着水面猛然合拢双螯。*
adv.oldborder.plot.066=*嗡——咔哒* 黄色荷马利上下晃动，然后用螯指向伏特里亚人所在的一侧。
adv.oldborder.plot.067=*荷马利族勇士用螯敲着甲壳——咔哒、咔哒、咔哒——随后将螯平举，指向敌方海岸。*
adv.oldborder.plot.068=*咔哒* 荷马利族勇士示意你向前，前往远处传来交战声的方向。
adv.oldborder.plot.069=*嗡——* 荷马利族勇士在地上敲了两下，又沿着原路来回巡逻。
adv.oldborder.plot.070=*荷马利族勇士缓缓敲出挑衅的节奏，巨螯划过水面。*
adv.oldborder.plot.071=*祭司将法杖在水中搅动，低低哼着咕噜作响的曲调。*
adv.oldborder.plot.072=*祭司哼着气泡般的旋律，目光始终游移不定。*
adv.oldborder.plot.073=*祭司用法杖轻点水面——咔哒，咔哒——然后指示你奔赴战场。*
adv.oldborder.plot.074=*荷马利温床缓缓冒着气泡。下方有什么东西挪动了一下，注视着你经过。*
adv.oldborder.plot.075=*你经过时，温床冒起温暖的气泡。幼体安然无恙。*
adv.oldborder.plot.076=你返回希亚尔军神殿，盟友们认出了你。
adv.oldborder.plot.077=你进入希亚尔军神殿。盟友认出了你，对立阵营则做好了战斗准备。
adv.realm.main.000=“几天前，我们的一些家人出海捕鱼，却再也没有回来。随后收到的，竟是传奇海盗贝克蒂霸司总帅亲自开出的天价赎金要求！”
adv.realm.main.001=“好志气！这些岛屿盘踞着几位极其可怕的强敌。击败其中最强的三位，我就把三件传奇宝物交给你。”
adv.realm.main.002=“整片森林都将永远铭记你的恩情！”
adv.realm.main.003=“总是这样，谁都没空搭理我们这些农民。可别忘了，是我们种粮食养活你们。”
adv.realm.main.004=“又是个没善心的。早知道就搬去森林主城了。”
adv.realm.main.005=“你也瞧见了，咱们那尊宝贝镇墓像碎了！全靠它，墓地里的亡者才能安安稳稳睡着。碎片还让人偷走了！没了它，等下次新月一到，可就要出大事了。”
adv.realm.main.006=“你也知道，许多可怕的传奇强者正在威胁这片土地。谁能击败森林面临的三大强敌，我便以三件珍贵宝物相赠。”
adv.realm.main.007=“旅人，保重。愿你能寻得的好运为你指路。”
adv.realm.main.008=“依尼翠来的一帮坏家伙。一个漂亮却疯疯癫癫的女人，叫基沙；一个阴狠的研究狂，叫基拉夫；还有个僵尸模样的家伙，叫威海特。他们窝在某处大墓地里，八成一人拿着一块。替咱们找回全部三块，大伙儿一定感激不尽，也能凑些钱酬谢你。”
adv.realm.main.009=“正是如此。他住在沼泽另一处城堡里，模样和这里很像。杀死他，取回血碗，你便能获得我们守护者的眷顾，以及相称的报酬。”
adv.realm.main.010=“当然。若能除掉他，全城都会感念你的恩情，给予祝福，悬赏自然也少不了。去找一座古怪的青绿色实验室，他就在里面。”
adv.realm.main.011=“太好了！详细说来实在丢脸。简而言之，不久前我们与赞迪卡联军交战，惨遭败绩。许多英勇的战士倒下了，更可恨的是，他们还夺走了我们珍贵的战旗！”
adv.realm.main.012=“太好了！我们德鲁伊负责维持主城的魔法结界。几周前，一头巨大的多头龙袭击了城市。结界撑住了，却有颗漏过来的脑袋叼走了我们最幸运的三叶草。我们得把它找回来。”
adv.realm.main.013=“很好，我们就直说了。必须死的，是非瑞克西亚魔判官希欧蕊本人。细语者，启示天灾——这些名号绝非虚言，但她非死不可。若你能办到，我城必将厚待于你，并奉上大笔金币。”
adv.realm.main.014=“能做到的人本就不多。愿你的本领与勇气日益精进。”
adv.realm.main.015=“那就走吧。等你有了信心，再回来。”
adv.realm.main.016=“真正的救星果然谦逊。平原虽有许多强大的传奇人物肆虐，但都比不上那三位最可怕的存在。若能击败他们，我便将神殿最神圣的三件宝物交给你。”
adv.realm.main.017=“但愿你真有吹嘘的本事，否则下场恐怕比死还惨——你可能会变成敌人中的一员。没错，如今让我们焦头烂额的，正是非瑞克西亚魔判官弗霖凯本人。”
adv.realm.main.018=“不得不说，小家伙，你让我刮目相看！这些报酬，还有全体山民的感激，都是你应得的。”
adv.realm.main.019=“若你觉得我们可怕，劝你趁还来得及，赶快离开沼泽。”
adv.realm.main.020=“真是了不起的本领！这世上正需要更多你这样的英雄。愿你今后的壮举，也都像今日一样功成。”
adv.realm.main.021=“不可思议！你的魔法果然强大！多亏你出手，我们才没有变成他麾下的金属爪牙。我们与全城居民都衷心感谢你。”
adv.realm.main.022=“不可思议，真是惊人的壮举。多亏你的英勇，整片森林都更安全了。”
adv.realm.main.023=“的确如此。愿撒拉拯救我们所有人。”
adv.realm.main.024=“正是。还有一件事：希欧蕊用法术遮蔽了据点，我们无法以占视术定位。不过，若你在旅途中遇见它，一眼就能认出——那是大地上一道溃烂的伤口，形如非瑞克西亚的徽记。”
adv.realm.main.025=“没错。这些吸血鬼自称暮影军团，来自依夏兰。他们自诩高贵，行径却恰恰相反。他们不断恐吓我们的居民，还躲过了历次围剿。若你能攻入要塞，除掉他们的领袖阿古尔元帅，我们必将报答你的英勇。那座要塞的正门上方悬着巨剑，很容易辨认。”
adv.realm.main.026=“正是。我们试着与他讲道理，他却躲进了藏身处。那里是一栋蓝白相间的建筑，模样和城里的房屋差不多。击败他，取回他的时间修复典籍，让我们补救他造成的破坏，你就能获得我们的祝福和报酬。”
adv.realm.main.027=“那是件魔法物品，是本地农业的命根子！你也许没留意，这里虽叫平原，周围如今却更像沙漠。水源稀缺，要养活这里的人口，就得有源源不断的水。他们的巢穴周围都是狮子，碰到了不会认不出来。找回水壶，我城自会感激你，并以金币酬谢。”
adv.realm.main.028=“那就离开吧。我们只好另想办法挽回荣誉。”
adv.realm.main.029=“听着，这地方能耕种的土地少得可怜。牲畜回不来，许多人就要饿死。尽可能救回些牲口，再杀掉那头偷盗的龙，我城必会报答你，给你一笔酬劳。据说那龙的巢穴是一栋涌出熔岩的黑暗建筑。”
adv.realm.main.030=“知道自己的极限，没什么可羞愧的。”
adv.realm.main.031=“并非所有吸血鬼都只知残暴。直到不久前，一位古老的吸血鬼仍在守护我城。她饮用一碗远古之血，便无须向居民索血解渴。可那只血碗被她的宿敌——黑暗的辛格氏男爵——偷走了。”
adv.realm.main.032=“不是普通的三叶草，是我们最幸运的那株。不，是世上最幸运的那株！我们的魔法虽强，可要在这被遗弃的世界里熬过重重灾难，还得有好运相助。那株三叶草正是好运之源。去加戈斯的湖中巢穴，从它肚子里找回三叶草，你就能得到我们的祝福。”
adv.realm.main.033=“也罢，我们就把报酬留给更有雄心的人。”
adv.realm.main.034=“改天？这里的时间本来就乱了套……好吧，改天。”
adv.realm.main.035=“驭蜂奶酪！一块施了魔法、能号令蜜蜂的奶酪！我们觉得其他类似的虫子也听它的，可东西又不在手上，没法试。总之，取回奶酪，阻止虫群，我城就会赐予你祝福，再附上一笔钱。她的巢穴像一副巨大的肋骨架，绝不会看漏。”
adv.realm.main.036=“黑暗诸神很满意！信徒们终于可以继续祈求恩典了。全城都感谢你。”
adv.realm.main.037=“铸物勋爵克撒，疯狂的结界师祖尔，以及深洋君王奇奥拉。击败他们，把他们原先持有的遗物带来，我便赐你难以想象的知识与力量。”
adv.realm.main.038=“威胁我城的，正是非瑞克西亚魔判官洼巴司。有人说他是五位魔判官中最弱的，可他无可匹敌的速度，以及那诡异火焰毁灭一切的灼热，实在让我们无法认同这种说法。”
adv.realm.main.039=“前些天，我们把牲口赶到城外吃草，一头叫天君普罗许的大恶龙突然俯冲下来，杀光了守卫。随后一大群小狗头人冲进来，把我们的牲口全掳走了！”
adv.realm.main.040=“平原的人民与光明诸神，都在传颂你的功绩！”
adv.realm.main.041=“始灾札卡玛、撼世妮莎，还有无尽松鼠军团的统帅聒牙。把击败他们后取得的遗物带来，丰厚的奖赏和全城由衷的敬爱就都属于你。”
adv.realm.main.042=“复归国王肯理斯、穹光策士德蕾薇，以及希望圣源吉娅妲。他们都受了诅咒，背离了昔日高尚的道路。带来他们曾持有的遗物，你就能得到神圣的祝福，以及全城永不消逝的感激。”
adv.realm.main.043=“威胁主城的，正是非瑞克西亚魔判官金吉塔厦。他的烁油正遍染大地，而阻止烁油侵入主城水源的结界已开始松动。一旦结界崩溃，我们都难逃厄运。”
adv.realm.main.044=“三重女祭司卡莉雅、暴民头目克仑可，还有地狱马刺帮的首领阿库尔。把他们曾携带的遗物拿来，我便赠你我最好的咒语与遗物。”
adv.realm.main.045=“吸血鬼始祖艾德嘉马可夫、噬惧魔瓦伽沃，以及扎瓦的恐怖之物——噬人蛙怪。杀死他们，带来他们曾持有的遗物，你便能获得我所侍奉的黑暗之神的祝福。”
adv.realm.main.046=“如今平原上危机四伏。就连昔日高尚的英雄与天界的天使，也被这片土地上的暴戾诅咒逼疯了。不过，我们今天遇到的麻烦来自更常见的祸源——吸血鬼。”
adv.realm.main.047=“许多强得令人胆寒的传奇人物正在威胁沼泽。谁能击败其中最可怕的三位，我便以三件圣物相赠。”
adv.realm.main.048=“这些山脉正遭受可怕的传奇强者蹂躏。若你能击败最强的三位，我就以三件真正的传奇宝物作为酬谢。”
adv.realm.main.049=“你的魔法造诣，确实无人能及！”
adv.realm.main.050=“我们钦佩你的勇气。但眼下威胁这座伟大城市的，是机械之母艾蕾侬本人。或许还没到彻底绝望的地步，却也相去不远了。”
adv.realm.main.051=“我们凑齐了家底，仍付不起她索要的天价赎金。若你能拿到标明人质关押地点的地图，我们愿把筹来的钱全给你，也会送上全城的祝福。只是恐怕非打败她不可。她藏在一个叫‘高枕无忧’（High and Dry）的地方，我们不知道具体在哪。那里看上去就是普通码头，却聚集着一群可怕的海盗。”
adv.realm.main.052=“我们被出卖了！不久前，我们才与狮族领袖肯芭会谈。她走后，我们发现她的猫族盟友竟偷走了那只永流不竭的浇水壶！”
adv.realm.main.053=“干得好！我们终于能着手修复他造成的时间破坏，也许还能完成他未竟的法术……不过，风险如此之大，我们或许不会再尝试了。无论如何，感谢你的帮助。”
adv.realm.main.054=“但愿如此，因为这项任务要你直面传奇时间法师泰菲力本人。他一直在编织法术，试图逆转时间，把大家送回各自的时空。问题是，法术在群岛各地造成了浩劫，却始终没见成效。”
adv.realm.main.055=“问题就是那些蜂！蜜蜂、黄蜂、胡蜂，还有什么我都不敢想！这些该死的虫子正钻进我们的粮仓。我们发现这绝非偶然，背后是那个恶毒的杀手——曦拉亚里恩。我们需要有人除掉她，取回她的驭蜂奶酪。”
adv.realm.main.056=“若将来神明向你启示，不妨再来。眼下，就带着诸神的祝福上路吧。”
adv.realm.main.057=“若你日后立下壮举，再回来吧。也许那时，我的祈祷就能得到回应。”
adv.realm.main.058=“总得有人出手。为了我们所有人，但愿你真有这本事。真到万不得已，我们也会迎战，可为了抵挡他的进攻，我们已经折损了几位最出色的法师。去找一座如噩梦中熔炉般的建筑，他就在里面。杀死他，我城会感念你的恩情，并奉上一大笔金币。”
adv.realm.main.059=“唉，也不是谁都能成为最强者。”
adv.realm.main.060=“我们确实需要一位英雄。光是抵挡她瓷甲军团的第一波攻势，就不知有多少士兵阵亡，想来令人不寒而栗。去瓷器与血肉筑成的要塞寻找她吧。若你真能击倒她，我们将永远感念你的恩情，并以厚礼和大量金币酬谢。”
adv.realm.main.061=“能救回多少就算多少吧，总比挨饿强！谢谢你，英雄。并不是人人都肯像你这样，花时间帮助我们这些小人物。”
adv.realm.main.062=“知晓自己的极限，也是明智之举。”
adv.realm.main.063=“是的，他的巢穴是一座铜铸要塞。他的爪牙就已身怀剧毒、力大无穷，何况他本人。击败他，你便当之无愧地获得我城的祝福，我们也会付你丰厚的报酬。”
adv.realm.main.064=“你说话简直和市议会一个调子。虽然他们禁止我们去抢回来，可这关乎荣誉！没了战旗，大家士气尽丧。若你能向那该死的塔兹莉将军复仇，夺回战旗，我们必会厚待你，并奉上酬劳。你要找的营地像一座灰石山丘，山顶就插着他们夺走的那面旗。”
adv.realm.main.065=“今日你可帮了我们大忙！战旗虽不是我们亲手夺回的，但阵亡同袍的大仇得报，已是莫大的慰藉。我们会长久传唱你的英勇事迹！”
adv.realm.main.066=“你的力量果然非同凡响。日后也许还有用得着你的地方。眼下，这是许诺给你的报酬，还有我们的感谢——尽管有些人恐怕不太情愿道谢。”
adv.realm.main.067=（继续）
adv.realm.main.068=（结束对话）
adv.realm.main.069=一群面色凝重的妖精围着桌子，仔细研究着地图。“若你自信能对付真正可怕的强敌，我们有一份悬赏。否则，请离开。”
adv.realm.main.070=确实是个可怕的对手。
adv.realm.main.071=许多农民围在前方的建筑旁，向一位焦头烂额的地方官诉苦。“你是冒险者吗？我真需要帮手！”
adv.realm.main.072=一队骑士正焦虑地准备出战。“旅人，你好。你身上的勇气正是我们需要的。不过，先提醒你：这项委托绝不轻松。”
adv.realm.main.073=一群忧心忡忡的居民在楼旁来回踱步。“旅人，求求你！情况紧急！海盗绑走了我们的家人！”
adv.realm.main.074=前方驻军营地里，一位全副武装的战士高声招呼：“旅人，你好！若你身手不凡，又看重荣誉，请过来听听我们的请求。”
adv.realm.main.075=一位法师走上前，点头证实了你的话，满屋顿时欢声雷动。“为英雄欢呼！愿阳光永远照耀着你！”
adv.realm.main.076=强大的英雄？听起来就是我。
adv.realm.main.077=一群唤龙者吵吵嚷嚷地聚在市政厅周围。“你！你是否无所畏惧，而且自信能阻止连我们整个议会都打不过的敌人？”
adv.realm.main.078=真是个十足的海盗恶棍。
adv.realm.main.079=魔法雕像的三块碎片，都在这里。
adv.realm.main.080=你靠近这栋建筑时，周围连时间都扭曲了，令你一阵眩晕。“旅人，你好！这里出了大麻烦，需要一位强大的法师才能解决。你有这本事吗？”
adv.realm.main.081=记得打开我身后的宝箱。里面有返回此处和前往五座主城的符文，还有助你赶路的加速、飞行、治疗法杖，以及探测敌方魔力的魔力视石。你身上也有一些挑战币，可凭它们免费参加城镇旅店里的轮抽赛事，一试身手。
adv.realm.main.082=临走前，尽管取用这里的物资。我从无数死者的遗物中收集了它们，就是希望交到你这样的人手上。你身后的告示牌也写着一些有用的建议。
adv.realm.main.083=没问题。
adv.realm.main.084=继续
adv.realm.main.085=的确是个可怕的对手。
adv.realm.main.086=那得看你具体指什么。
adv.realm.main.087=你知道吗？每个区域都有 20 座城镇，外围各色区域另有一座主城。点击顶部菜单栏左侧的星号，可以为实用的城镇或地牢加上收藏标记。某些地牢内部也有专属商店。
adv.realm.main.088=你知道吗？每个装备栏位都有对应的主题：\n颈部：结界\n身体：被动调整生命或手牌上限的物品，或地牌\n左手：一次性神器或结界\n右手：武具\n脚部：生物\n极少数物品不占栏位，或使用自定义栏位。它们不会出现在角色轮廓图上，但仍会以勾选标记表示已装备。
adv.realm.main.089=你知道吗？五色区域的主城都有出售独特角色物品的商店。主城还有铁匠铺，可按指定条件制作卡牌；城中的委托也会给予额外的永久生命加成及其他奖励。不妨优先拜访各座主城。
adv.realm.main.090=你知道吗？每个敌人被击败后，都会掉落其指挥官，以及其他描绘同一角色的卡牌。根据敌人难度和你选择的游戏难度，还会从其套牌及全部卡牌中掉落一些牌，另有金币和法术力碎片。首领还有机会掉落外观类奖励，例如风景素描册和常用牌的异画版。风景素描册会改变“添加基本地”菜单中可选的地牌；在套牌界面点击右上角的三个点即可进入该菜单。
adv.realm.main.091=你知道吗？套牌编辑界面只显示符合当前指挥官颜色特征的合法卡牌。若想查看全部收藏，请创建一副使用五色指挥官的套牌。本房间的宝箱里就备有一张，方便你使用！
adv.realm.main.092=你知道吗？背包容量没有上限。物品多得显示不下时，可使用物品界面物品区域右侧的隐藏滚动条。另外请留意：几乎所有角色物品都只有一件，不要随便丢弃！角色物品也无法出售，所以你的收藏会越来越丰富。
adv.realm.main.093=那可不像是我。
adv.realm.main.094=听起来不太适合我。
adv.realm.main.095=艾蕾侬已被击杀。
adv.realm.main.096=她的……什么？
adv.realm.main.097=地图在这里，循着它就能找到你们的亲人。
adv.realm.main.098=战旗给你们带回来了，想必荣誉也一并回来了。
adv.realm.main.099=我能帮什么忙？
adv.realm.main.100=我正是。你们需要什么？
adv.realm.main.101=我会尽力成为你们的救星。
adv.realm.main.102=这个我能办到。
adv.realm.main.103=我能对付她。
adv.realm.main.104=我没时间管这事。
adv.realm.main.105=黑暗诸神我不懂，不过当个勇士倒没问题。
adv.realm.main.106=我还有更重要的事要做。
adv.realm.main.107=你们如此无礼，我可没兴趣帮忙。
adv.realm.main.108=我想我能对付他。
adv.realm.main.109=我会尽力而为。
adv.realm.main.110=我来试试，争取把这场“蜂波”平息。
adv.realm.main.111=我会全力迎战他。
adv.realm.main.112=那我就不打扰各位了。
adv.realm.main.113=放心，我会救回你们的亲人。
adv.realm.main.114=我会看看能做些什么。
adv.realm.main.115=我看看什么时候能抽出空办这事。
adv.realm.main.116=英雄嘛，我多少也算得上一种。
adv.realm.main.117=眼下我还没准备好接任务。
adv.realm.main.118=这事交给我。
adv.realm.main.119=我很强，但还不是最强。
adv.realm.main.120=这些我听过了。（结束对话）
adv.realm.main.121=若你能征服这两座宇宙监牢中强得不可思议的存在，自由便属于你。不过，要取得这样的胜利，还有一段漫长而艰险的路要走。
adv.realm.main.122=“不可能”听着也太难了。
adv.realm.main.123=每片有色区域都有一座城堡，如今已被其余四色的力量占据。每座城堡都藏着一把通往太初龙监牢的钥匙。那是一个强大的存在，征服它，便能取得逃离这里所需的一半关键之物。
adv.realm.main.124=也许真是如此。
adv.realm.main.125=金吉塔厦已被击杀。
adv.realm.main.126=如你们所愿，号令蜂群的奶酪带回来了。
adv.realm.main.127=我总觉得，这件事的重点不该是战旗。
adv.realm.main.128=记住，你面对的每位传奇人物都是独一无二的。虽说他们来自不同的时空和时代，但大战过后，每人都只剩下一个版本。因此，每一次胜利，都会让你离成功更近一步。
adv.realm.main.129=随他们议论，我什么敌人都敢面对。
adv.realm.main.130=对我来说，恐怕太不可能了。
adv.realm.main.131=改天再说吧。
adv.realm.main.132=眼下这事对我来说可能太难了。
adv.realm.main.133=既强大又重荣誉，听起来正是在说我。
adv.realm.main.134=我的魔法确实很强。
adv.realm.main.135=你会见识到我的咒语有多强。
adv.realm.main.136=接近不可能，就意味着仍有可能。
adv.realm.main.137=再可怕的敌人，我也不惧。
adv.realm.main.138=严格来说，没有谁囚禁了你。多年前，这个时空的法术力突然暴涨，将多重宇宙中、甚至不同时代的传奇英雄、恶徒以及形形色色的人物吸引到这里，把他们一同困住了。
adv.realm.main.139=我还不确定自己能应付。
adv.realm.main.140=我不确定自己有这本事。
adv.realm.main.141=我什么都不怕。你们要除掉谁？
adv.realm.main.142=对我而言，没有不可能。
adv.realm.main.143=现在，出发吧。愿你的牌库里永远有你需要的咒语。
adv.realm.main.144=一株三叶草。虽然有些黏糊糊的，却竟然还完好无损。
adv.realm.main.145=说好的浇水壶，给你带回来了。
adv.realm.main.146=我可不擅长对付海盗。
adv.realm.main.147=事情倒很明白，就是不容易办。
adv.realm.main.148=辛格氏已被击杀。
adv.realm.main.149=几个掘墓人围在一座基座旁，上面只剩雕像断裂的双脚。“嘿，你！看着像个英雄！帮帮咱们这些可怜人呗！”
adv.realm.main.150=希欧蕊已被击杀。
adv.realm.main.151=希欧蕊必将倒在我手下。
adv.realm.main.152=那么，是谁拿走了碎片？
adv.realm.main.153=所以，你们要我去救鸡？
adv.realm.main.154=有些法师喜形于色，另一些却莫名地有些懊恼。“我们就你能否成功打了个小赌。不过请相信，你的胜利让我们所有人都赢得了平安，至少眼下如此。干得漂亮。”
adv.realm.main.155=改天吧。
adv.realm.main.156=还有一些城镇留存，它们原是多重宇宙各地更大聚落的一部分。虽已不复昔日盛况，多数仍有助你成功的咒语和装备。五色区域的主城也值得一访，那里的商人出售更强大的物品与咒语。
adv.realm.main.157=听起来有点不对劲。
adv.realm.main.158=看来我得好好跟时间较量一番了。
adv.realm.main.159=这片土地最强的战士，就是我。
adv.realm.main.160=泰菲力已被击败，希望还来得及。
adv.realm.main.161=说说这项任务吧。
adv.realm.main.162=洞穴标记代表相对最不危险的地方，但依然可能致命。地牢标记代表更凶险的据点，而城堡标记所在，则是幸存传奇人物中最强者的领地。
adv.realm.main.163=德鲁伊们欢欣鼓舞。“太好了！我们就知道，这株三叶草一定够幸运，连被吞进肚子里都能幸存！如今好运又将眷顾我城，愿它也同样眷顾你！”
adv.realm.main.164=暮影军团的指挥中枢已经遭到重创。
adv.realm.main.165=家属们喜极而泣。“谢谢你！真的太感谢了！这些报酬实在不足以酬谢你的英勇，但请记住，在我们心中，你永远是英雄。”
adv.realm.main.166=掘墓人将碎片拼回原处，又小心涂上一些恶臭的黑色黏液，竟粘得相当牢固。“跟新的一样！真是太谢谢你啦！”
adv.realm.main.167=守卫们高举奶酪，虫群应声飞离。“可算解脱了！真不知道该怎么谢你！全城居民也都感谢你。这样入冬后，我们就不用挨饿了。”
adv.realm.main.168=你走近一座由熔岩加热的巨大锻炉，热浪扑面而来。一名巨人正挥锤锻打一柄巨剑，朝你喊道：“我要找这片土地上最强的战士。若不是你，就走吧。”
adv.realm.main.169=你走进这座阴森的建筑，里面尽是面色不善的邪术师。“你就是 '{'var=player_name'}'，对吧？我们听过一些关于你的传闻。你是否有能力完成我们的委托，尚不好说。不过即便失败，或许也能削弱我们的对手。”
adv.realm.main.170=人群愤怒的嘲讽声，淹没了地方官的抱怨。
adv.realm.main.171=市政厅里气氛凝重，恐惧弥漫。一位白袍法师模样的人对你说：“旅人，这真是黑暗的时代。我们本不愿向你求助，因为这项任务或许根本不可能完成。可我们已走投无路。”
adv.realm.main.172=另一半关键之物藏在奥札奇的监牢中。进入那片不祥之地需要五把钥匙，它们分别藏在中央荒地最强大的地牢里。你很快就会来到那片荒地。
adv.realm.main.173=农民们欢呼起来。“庄稼有救了！感谢你的英勇！”
adv.realm.main.174=唯一的例外是游荡在野外的人。他们与你一样，拥有死而复生的能力。不过，早在你到来之前，他们就已死过不知多少回，因此也没什么财物可供搜刮。
adv.realm.main.175=三大威胁已经铲除。
adv.realm.main.176=你转身离去时，居民们向你投来鄙夷的目光。
adv.realm.main.177=吸血鬼侍从捧着碗急忙跑进墓穴。片刻后，一位气势逼人的女吸血鬼大步走出。“多谢你令我复苏。杀死男爵，想必绝非易事。如今，我终于能履行久远的誓言，继续永世守护这座城市。”
adv.realm.main.178=巫师们重新陷入沉思，任你离去。
adv.realm.main.179=他们能横行的夜晚，没剩几个了。
adv.realm.main.180=为一只浇水壶，至于闹成这样吗？
adv.realm.main.181=这个世界任你探索，只看你如何选择，又有多少胆量。你已得到一张魔法地图，请记好这些指引：
adv.realm.main.182=该去夺回战旗了。
adv.realm.main.183=该做点英雄事迹了。
adv.realm.main.184=是时候终结一位古老的吸血鬼了。
adv.realm.main.185=那位确实无愧于“传奇”之名。
adv.realm.main.186=在这地方见到吸血鬼，还真不寻常。
adv.realm.main.187=洼巴司已被消灭。
adv.realm.main.188=弗霖凯已被击杀。
adv.realm.main.189=战争自然立刻爆发，并将整个时空蹂躏得满目疮痍。幸存的传奇人物躲进散布各地的要塞、洞穴和高塔。谁敢闯入，打破他们自以为安全的幻象，就会遭到攻击。
adv.realm.main.190=欢迎你，鹏洛客 '{'var=player_name'}'。你和数百位传奇人物一样，如今都被困在这个世界——传奇之境。这里曾名为山德拉，是一个宁静而法术力充盈的时空。
adv.realm.main.191=我确实有点本事，但还没到那个地步。
adv.realm.main.192=那就看看我的运气吧。
adv.realm.main.193=出了什么麻烦？除了这些蜂以外。
adv.realm.main.194=你们遇到了什么危机？
adv.realm.main.195=你说的是哪三位？
adv.realm.main.196=是谁把我困在这里？
adv.realm.main.197=你走近一群围在圣泉旁的德鲁伊。“旅人，你好！我们需要一位强大的英雄，替我们取回一件圣物。”
adv.realm.main.198=你走近一栋像是储粮仓库的建筑。几个人守在门外，浑身都是蜇伤的痕迹，还不停挥赶蜂群。“冒险者，求求你！帮帮我们！”
adv.realm.main.199=在这座遍布熔岩与岩石的城市里，你走近一间格格不入的农舍。奇怪的是，这里几乎见不到牲畜。“旅人，你好！我们遇到了麻烦，不知你能否相助？”
adv.realm.main.200=城墙之内竟有一座吸血鬼墓穴，令你十分意外。更奇怪的是，外面还站着几位吸血鬼侍从。“有血待流，也有血待寻。你愿回应它的召唤吗？”
adv.realm.main.201=你走进一座藏书高塔，古籍的气息萦绕四周。一位胡须长得夸张的巫师迎上前来。“我能感受到你体内强大的魔力。我需要一个能完成近乎不可能之事的人。”
adv.realm.main.202=你进入一座供奉众多光明、守护与良善之神的神殿。一位天使结束祈祷，转身问你：“你就是我祈求的那个人吗？我们的救星？”
adv.realm.main.203=你走进一座似乎供奉某位黑暗之神的神殿。一位身着黑袍、苍白而美丽的女祭司转身向你开口：“黑暗诸神需要一位勇士。你能回应他们的召唤吗？”
adv.realm.main.204=而你，每次死后都会重获生命，除了落败的痛楚与耻辱，不会留下其他损伤。只要有毅力、技巧和合适的咒语，你终能战胜任何敌人……迟早而已。
adv.realm.main.205=说真的，你们让我有点发毛。
adv.realm.main.206=你把守卫们留在原地，继续应付蜂蜇。
adv.realm.main.207=你还该知道，这里并非无法逃离。只是迄今为止，还没有人成功。
adv.realm.main.208=你走进一棵中空的树，内部竟宽敞得出奇。一位高大的树灵——也可能是元素，或树人——从树壁中现身。“冒险者，你好。我在寻找一位真正了不起的英雄。会是你吗？”
adv.realm.main.209=你大步走进宽阔的议事厅，一群神色严肃的巫师围在一颗巨大的宝珠旁。“若你掌握着强大的魔法，我们需要你的帮助。否则，请离开。”
adv.realm.main.210=你悄然离去。
adv.realm.main.211=你要我找回一株三叶草？
adv.realm.main.212=恐怕你们找错冒险者了。
adv.realm.main.213=鸡救回来了。至于牛和猪，恐怕早已成了盘中餐。
adv.realm.main.214=你们的雕像，马上就能复原了。
adv.oldborder.plot.032=巨大的甲壳装甲机械发出沉闷的轰鸣，操纵它的船员将舰首转向了你。
adv.oldborder.plot.033=（撤退）
adv.oldborder.plot.034=海之歌女的曲调变得冰冷而威严。“跪下，否则大海会教你服从。”
adv.oldborder.plot.035=古老的深渊魔裔缓缓升起，庞大的身躯遮住了浪涛。“渺小的岸行者……与那些古老的石块一同沉没吧……”
adv.oldborder.plot.036=蠕动的孵化体猛然痉挛，甲壳下数十只黑眼睁开，周围的水池开始翻腾。
# Old Border exploration and Innistrad opening NPC dialogue
adv.oldborder.explore.000=恐怕不能让你进去。我们公会十分看重驯养鸟类的秘法，那是数千年积累的成果，绝不能让竞争对手窥探。任何未经许可闯入鹰巢的人都会遭到守卫驱逐，就连那些鸟也受过训练，会攻击不速之客。
adv.oldborder.explore.001=多谢告知，再见。
adv.oldborder.explore.002=一扇大门挡住了去路。透过栅栏，你看见里面的房间中站着一个威严的身影。（需要集齐这座地牢中的五块碎片才能开门。）
adv.oldborder.explore.003=离开
adv.oldborder.explore.004=用五块碎片开锁
adv.oldborder.explore.005=继续
adv.oldborder.explore.006=铭文上写着：恭喜你，冒险者！只要找到这里，你就赢得了一份奖品！
adv.oldborder.explore.007=你兴高采烈地走向奖品。
adv.oldborder.explore.008=你感应到，山德拉各地的隐秘巢穴中潜伏着强大的生物。或许该记下自己逐一攻克这些巢穴的进展。
adv.oldborder.explore.009=（接受挑战）
adv.oldborder.explore.010=【已接取任务：地下城征服者】
adv.oldborder.explore.011=你感应到，这个生物只是潜伏在山德拉隐秘巢穴中的众多强者之一。或许该记下自己逐一攻克这些巢穴的进展。
adv.oldborder.explore.012=离开。
adv.oldborder.explore.013=唔，墙上嵌着一个大开关……至少曾经是。它似乎被熔化了，得有多高的温度才能做到啊。
adv.oldborder.explore.014=唔……墙上嵌着一个大开关。
adv.oldborder.explore.015=扳动开关
adv.oldborder.explore.016=北边传来几声巨响。
adv.oldborder.explore.017=这扇门锁着。
adv.oldborder.explore.018=用墓蛙的钥匙开锁
adv.oldborder.explore.019=用生锈的旧钥匙开锁
adv.oldborder.explore.020=前方有危险猛兽！立即折返！
adv.oldborder.explore.021=你好，鹏洛客'{'var=player_name'}'。此区域仍在开发中，内容可能调整。另外，这里的首领很强，请准备好一副强力套牌。
adv.oldborder.explore.022=好的
adv.oldborder.explore.023=一扇装着奇特门锁的巨门挡住了去路。
adv.oldborder.explore.024=一扇装着五色门锁的巨门挡住了通往伪神的道路。
adv.oldborder.explore.025=用通往伪神的五把钥匙开锁
adv.oldborder.explore.026=大门已经打开。现在，你可以直面伪神卡若娜了。
adv.oldborder.explore.027=你面前矗立着一簇古老的晶体，原初法术力在其中脉动。这里的钻石是山德拉最初时代的遗存，可以用来换取魔法初生年代的咒语。
adv.oldborder.explore.028=用10,000金币换取一包Beta补充包
adv.oldborder.explore.029=晶体闪烁着光芒，吸收了你的金币。作为交换，一包来自魔法初生年代的密封补充包出现在你面前！
adv.oldborder.explore.030=你的金币不足。激活这些古老钻石需要10,000金币。
adv.oldborder.explore.031=用400碎片换取一包Beta补充包
adv.oldborder.explore.032=晶体闪烁着光芒，吸收了你的法术力碎片。作为交换，一包来自魔法初生年代的密封补充包出现在你面前！
adv.oldborder.explore.033=你的法术力碎片不足。激活这些古老钻石需要400碎片。
adv.oldborder.explore.034=你好，鹏洛客。你可懂得欣赏赌注的妙处——在生死决斗中押上自己的牌？
adv.oldborder.explore.035=是的，我启用了赌注。
adv.oldborder.explore.036=我有许多强大的咒语，能让赌局的天平向你倾斜！有了这些手段，你就能从敌人那里赢来无数咒语——下界之契约、恶魔律师、宝石鸟、青铜碑，还有更多……只需拿你灵魂的一小片来换。意下如何？
adv.oldborder.explore.037=接受交易
adv.oldborder.explore.038=明智的决定……不过，概不退还。
adv.oldborder.explore.039=拒绝
adv.oldborder.explore.040=那么，或许我该亲自夺走你的整个灵魂！
adv.oldborder.explore.041=不，我没有启用赌注。
adv.oldborder.explore.042=那么，我还有一份绝妙的提议——只用你灵魂的一小片，换取惊人的财富。20,000金币如何？这笔财富足以媲美国王！像你这样高贵强大的冒险者，自然当之无愧。那么，成交吗？
adv.oldborder.explore.043=一只幽灵般的史芬斯出现在你面前，双眼闪烁着古老智慧的光芒。\n\n“求知者，答对我的六道谜题，强大的力量便归你所有。若是答错，就改日再来。”\n\n“魔法初生、Alpha问世之时，有一个生物的力量胜过其余所有生物。它叫什么名字？”
adv.oldborder.explore.044=西瓦巨龙
adv.oldborder.explore.045=“那条龙确实令人难忘，却不是力量最大的。想清楚了再来吧。”
adv.oldborder.explore.046=万物元气兽
adv.oldborder.explore.047=“正确！在那个年代，这个8/8元素无人能及。”\n\n“那么……后来到了古文明之战（Antiquities）的时代，又有一个强大的生物超越了它。那是谁？”
adv.oldborder.explore.048=三臂铁人
adv.oldborder.explore.049=“那个组构体构造精巧，却不是力量最大的。想清楚了再来吧。”
adv.oldborder.explore.050=苏其
adv.oldborder.explore.051=“那个神器生物颇有价值，但另有更强的存在。想清楚了再来吧。”
adv.oldborder.explore.052=沙地亚巨像
adv.oldborder.explore.053=“正是！这个9/9神器巨人凌驾于所有同类之上。”\n\n“然而，黑暗（The Dark）之中又出现了一个力量更胜于它的生物。人们低声传颂着谁的名字？”
adv.oldborder.explore.054=无名一族
adv.oldborder.explore.055=“那个生物确实没有名字，却也没有那么大的力量。想清楚了再来吧。”
adv.oldborder.explore.056=海怪
adv.oldborder.explore.057=“不错！这个10/10海兽从深渊中崛起。”\n\n“后来，世界被冰雪覆盖，进入冰雪时代（Ice Age），这个强大的生物又被另一个生物超越了……”
adv.oldborder.explore.058=拉高耶夫
adv.oldborder.explore.059=“啊！汉斯，快跑！……不过，不，这不是答案。想清楚了再来吧。”
adv.oldborder.explore.060=锐鳞亚龙
adv.oldborder.explore.061=“那条亚龙确实体型庞大，但还有更大的。想清楚了再来吧。”
adv.oldborder.explore.062=极地巨海兽
adv.oldborder.explore.063=“正确！这个11/11巨海兽统治着冰封的海洋。”\n\n“随后，到了海市蜃楼（Mirage）的年代，又有新的王者夺得桂冠……”
adv.oldborder.explore.064=非瑞克西亚无畏舰
adv.oldborder.explore.065=“正是！这个12/12的恐怖存在，只是索要的代价也极为惨重。”\n\n“而在这段岁月的尾声，力量的纪录又被最后一次打破……”
adv.oldborder.explore.066=戾气元素希沃斯
adv.oldborder.explore.067=“不，那个元素虽然强大，却还有别的生物超越了它。想清楚了再来吧。”
adv.oldborder.explore.068=忿怒天使爱若玛
adv.oldborder.explore.069=“可惜，不是。那位天使虽强，却不是力量最大的。想清楚了再来吧。”
adv.oldborder.explore.070=克洛萨入云兽
adv.oldborder.explore.071=“精彩！你已证明自己熟知古老的强者！”\n\n史芬斯的身形闪烁着消散了，留下价值不菲的宝物。
adv.oldborder.explore.072=夜之灵
adv.oldborder.explore.073=“不，那个精怪虽然可怕，却不是力量最大的。想清楚了再来吧。”
adv.oldborder.explore.074=塔尼瓦
adv.oldborder.explore.075=“那条巨蛇确实难缠，却不是我要的答案。想清楚了再来吧。”
adv.oldborder.explore.076=蠕虫林树妖
adv.oldborder.explore.077=“那个树妖确实阴暗，却不是力量最大的。想清楚了再来吧。”
adv.oldborder.explore.078=暗渊之王
adv.oldborder.explore.079=“接近了，但那个恶魔索要牺牲，却并非最强者。想清楚了再来吧。”
adv.oldborder.explore.080=一道闸门挡住了去路，看样子要从别处打开。
adv.oldborder.explore.081=唔，墙上嵌着一个大开关。
adv.oldborder.explore.082=中央传来几声巨响。
adv.oldborder.explore.083=这扇门锁着。不过，从地板上的刮痕来看，它似乎经常被打开，钥匙应该就在附近。
adv.oldborder.explore.084=你好，目前还没有什么事需要你做……\n暂时没有。
adv.oldborder.explore.085=再见
adv.oldborder.explore.086=你好，鹏洛客'{'var=player_name'}'。
adv.oldborder.explore.087=这里……是山德拉。在这个时空，魔法仍保留着遥远往昔的模样。
adv.oldborder.explore.088=伪神卡若娜把你困在了这里。要击败她，还有很长的路要走：你必须先攻克五座城堡，再闯过她神殿内通往的另外五座神殿。每一处都有强大的守卫。
adv.oldborder.explore.089=探索这个世界，收集咒语充实你的牌库，寻找神器来武装自己。想要成功，你离不开它们的力量。
adv.oldborder.explore.090=我还有些东西要给你，'{'var=player_name'}'。虽然不多，也许能帮上忙。
adv.oldborder.explore.091=拿这枚硬币去任何旅店，就能参加一场考验技巧与魔法的挑战。这里的法师称之为轮抽。
adv.oldborder.explore.092=那这些素描簿呢？
adv.oldborder.explore.093=在套牌界面的“添加地牌”菜单中，它们能让你选择从哪些地汲取力量。
adv.oldborder.explore.094=还有一件事——独自冒险太危险了！拿上这些。你最多可以挑选两包。
adv.oldborder.explore.095=（领取红色补充包）
adv.oldborder.explore.096=（领取绿色补充包）
adv.oldborder.explore.097=（领取黑色补充包）
adv.oldborder.explore.098=（领取白色补充包）
adv.oldborder.explore.099=（领取蓝色补充包）
adv.oldborder.explore.100=“再见。”
adv.oldborder.explore.101=“我已经击败了全部五位守卫。”
adv.oldborder.explore.102=“啊，现在我感应到了——你说的是真的。守卫们已经倒下，只是魔法的共鸣有些……散乱。无妨，事情既已办成就好。再来和我谈谈，我们就能商量下一步了。”
adv.oldborder.explore.103=“看来我该说得更清楚些。你击败的守卫并不是囚禁你的人，至少不直接是。不过，他们守护着通往伪神神殿的钥匙。”
adv.oldborder.explore.104=“那是什么地方？”
adv.oldborder.explore.105=“它就位于这片荒野。里面的传送门通往另外五座神殿，每座都有更强大的守卫。必须将他们全部击败，才能面对伪神。”
adv.oldborder.explore.106=“如果还没做，就用五把不同颜色的钥匙打开其中一座城堡的闸门。取走里面那把奇特的钥匙，再进入伪神神殿。”
adv.oldborder.explore.107=最后的挑战正在伪神神殿中等着你。击败她之后，你可以为这段旅程画上句号，也可以继续探索，扩充自己的收藏。
adv.oldborder.explore.108=开发者说明：剧情提示到此结束。完成最终挑战，并体验完你感兴趣的其他内容后，可以重新开局，或尝试“新游戏+”。后者只保留卡牌和物品，其余进度不会继承。
adv.oldborder.explore.109=恭喜你抵达最终篇章！
adv.oldborder.explore.110=当你向暗渊之王打出最后一击时，一股强烈的法术力波动随之涌来。眼前的威胁消除后，你终于看清：大厅北端那间上锁的房间里并没有囚犯。
adv.oldborder.explore.111=当你向暗渊之王打出最后一击时，又一股法术力波动随之涌来。但与之前一样，败敌身后那间上锁的房间里并没有囚犯。
adv.oldborder.explore.112=一扇大门挡住了去路。透过栅栏，你看见里面房间中的黑玉玛珂。（需要集齐五把不同颜色的钥匙才能开门。）
adv.oldborder.explore.113=用五把不同颜色的钥匙开锁
adv.oldborder.explore.114=你来到闸门前。
adv.oldborder.explore.115=暗渊之王，我已照你说的做了！该做个了结了！
adv.oldborder.explore.116=你还不够格，退下！
adv.oldborder.explore.117=欢迎你，'{'var=player_name'}'。我仁慈的主人暗渊之王，早已迫不及待地等着这一刻。
adv.oldborder.explore.118=恐怕我不能这么做。我不过是强大的暗渊之王的一介仆从，他统治着一切邪秽之物。
adv.oldborder.explore.119=想证明自己有资格觐见我那统御邪恶之域的尊贵主人，就先击败潜伏在这座受诅咒地牢中的全部四个敌人，展示你的力量吧。磨利刀剑，备好咒语，鼓起勇气——前方的挑战，即使是身经百战的勇士也未必能承受。
adv.oldborder.explore.120=我会证明自己的实力。等我击败这些挑战者，你可得把门打开。
adv.oldborder.explore.121=一扇大门挡住了去路。透过栅栏，你看见里面房间中的蓝宝石玛珂。（需要集齐五把不同颜色的钥匙才能开门。）
adv.oldborder.explore.122=你来到一道闸门前。
adv.oldborder.explore.123=海怪，我已照你说的做了！该做个了结了！
adv.oldborder.explore.124=闸门突然在你眼前消失了，现在可以通行了。
adv.oldborder.explore.125=欢迎你，'{'var=player_name'}'。海怪早已迫不及待地等着这一刻。
adv.oldborder.explore.126=恐怕我不能这么做。我不过是强大的海怪的一介仆从，他统治着海洋深处。
adv.oldborder.explore.127=想证明自己有资格觐见我尊贵的主人，就先击败潜伏在这座地牢中的全部四个敌人，展示你的力量吧。\n磨利刀剑，备好咒语，鼓起勇气——前方的挑战，即使是身经百战的勇士也未必能承受。
adv.oldborder.explore.128=当你向戈厄塔打出最后一击时，一股强烈的法术力波动随之涌来。眼前的威胁消除后，你终于看清：大厅北端那间上锁的房间里并没有囚犯。
adv.oldborder.explore.129=当你向戈厄塔打出最后一击时，又一股法术力波动随之涌来。但与之前一样，败敌身后那间上锁的房间里并没有囚犯。
adv.oldborder.explore.130=一扇大门挡住了去路。透过栅栏，你看见里面房间中的翡翠玛珂。（需要集齐五把不同颜色的钥匙才能开门。）
adv.oldborder.explore.131=万兽女王，我已照你说的做了！该做个了结了！
adv.oldborder.explore.132=伴着震耳欲聋的咆哮，闸门轰然炸开，化作散落在路上的灰烬。现在可以通行了。
adv.oldborder.explore.133=欢迎你，'{'var=player_name'}'。万兽女王早已迫不及待地等着这一刻。
adv.oldborder.explore.134=恐怕我不能这么做。我不过是强大的万兽女王的一介仆从，她统治着所有野兽。
adv.oldborder.explore.135=想证明自己有资格觐见我那统御兽群之域的尊贵主人，就先击败潜伏在这座地牢中的全部四个敌人，展示你的力量吧。\n磨利刀剑，备好咒语，鼓起勇气——前方的挑战，即使是身经百战的勇士也未必能承受。
adv.oldborder.explore.136=当你向拉黎丝打出最后一击时，一股强烈的法术力波动随之涌来。眼前的威胁消除后，你终于看清：大厅北端那间上锁的房间里并没有囚犯。
adv.oldborder.explore.137=当你向拉黎丝打出最后一击时，又一股法术力波动随之涌来。但与之前一样，败敌身后那间上锁的房间里并没有囚犯。
adv.oldborder.explore.138=一扇大门挡住了去路。透过栅栏，你看见里面房间中的红宝石玛珂。（需要集齐五把不同颜色的钥匙才能开门。）
adv.oldborder.explore.139=锋翼洛里兹，我已照你说的做了！该做个了结了！
adv.oldborder.explore.140=欢迎你，'{'var=player_name'}'。龙王锋翼洛里兹早已迫不及待地等着这一刻。
adv.oldborder.explore.141=恐怕我不能这么做。我只是一条普通的龙，是强大的龙王锋翼洛里兹的一介仆从。
adv.oldborder.explore.142=想证明自己有资格觐见我那统御烈焰之域的尊贵主人，就先击败潜伏在这座地牢中的全部四个敌人，展示你的力量吧。\n磨利刀剑，备好咒语，鼓起勇气——前方的挑战，即使是身经百战的勇士也未必能承受。
adv.oldborder.explore.143=一扇大门挡住了去路。透过栅栏，你看见里面房间中的珍珠玛珂。（需要集齐五把不同颜色的钥匙才能开门。）
adv.oldborder.explore.144=欢迎你，'{'var=player_name'}'。爱若玛早已迫不及待地等着这一刻。
adv.oldborder.explore.145=恐怕我不能这么做。我不过是强大的爱若玛的一介仆从，她是天使的统领。
adv.oldborder.explore.146=想证明自己有资格觐见我那统御神圣之域的尊贵主人，就先击败潜伏在这座地牢中的全部四个敌人，展示你的力量吧。\n磨利刀剑，备好咒语，鼓起勇气——前方的挑战，即使是身经百战的勇士也未必能承受。
adv.oldborder.explore.147=旅店锁得严严实实。镇公所倒是连前门都不见了，可里面并没有什么特别的东西，只有摆放整齐、已经朽坏的文书，上面的墨迹模糊得无法辨认。
adv.oldborder.explore.148=你找到一本讲述妖精生理构造的书。有一页折了角作标记，介绍的是一种你在山德拉从未见过的妖精。
adv.oldborder.explore.149=巨大的组构体剧烈颤动，轰然倒下，齿轮也渐渐停止了转动。
adv.oldborder.explore.150=继续。
adv.oldborder.explore.151=释放他们。
adv.oldborder.explore.152=我们正在猎杀裂片妖后，但她的指挥官和士兵挡住了去路。\n\n杀死她的三名指挥官，或者消灭八只普通裂片妖，就能逼她现身。这应该足以激怒她了。
adv.oldborder.explore.153=离开
adv.oldborder.explore.154=*红色屏障在你眼前消融。你可以继续前进了。*
adv.oldborder.explore.155=铭文上写着：欢迎来到哈兰渔村。
adv.oldborder.explore.156=魔鬼发出刺耳的尖叫，倒在地上。它的血与受害者的鲜血混在一起，红色屏障随之消失。通往上层的道路打开了。
adv.oldborder.explore.157=一道闪烁着红光的半透明屏障挡住了去路。古老的邪恶潜伏在这些墓室中，阻止你进入前面的房间……
adv.oldborder.explore.158=独眼巨人发出刺耳的尖叫，倒在地上。它的血与受害者的鲜血混在一起，红色屏障随之消失。通往提勃的道路打开了。
adv.oldborder.explore.159=拷问者发出刺耳的尖叫，倒在地上。他的血与那些遭受折磨的受害者的鲜血混在一起，红色屏障随之消失。通往提勃房间的道路打开了。
adv.oldborder.explore.160=用拷问者的钥匙开锁
adv.oldborder.explore.161=门锁打开了，但钥匙也在开门时折断了。
adv.oldborder.explore.162=用幽灵的钥匙开锁
adv.oldborder.explore.163=一扇大门挡住了去路。透过栅栏，你看见里面的房间中站着一个威严的身影。
adv.oldborder.explore.164=用钥匙开锁
adv.oldborder.explore.165=*那可怜的农民蜷缩在你面前，瑟瑟发抖。*
adv.oldborder.explore.166=你自由了，辛格氏男爵已经被解决了。
adv.oldborder.explore.167=谢谢……谢谢你，勇敢的英雄。请收下这件物品，聊表我的感激。
adv.oldborder.explore.168=你走近房间中央一口布满蛛网的棺材。
adv.oldborder.explore.169=你打开棺材，一只巨大的鼹鼠从里面蹿了出来，满脸恼怒地瞪着你。
adv.oldborder.explore.170=你打开棺材，本以为会有什么古老的邪恶从中苏醒，结果只是自己想多了。
adv.oldborder.explore.171=你从空棺材里取走了战利品。
adv.oldborder.explore.172=墓室中央摆着一口装饰华丽的黑棺。黑暗能量在棺内涌动，你还能听见阵阵疯狂的低语从中传出。
adv.oldborder.explore.173=仔细查看棺材
adv.oldborder.explore.174=棺材上饰有柯帮的标志。你感到其中充斥着令人窒息的惧像与梦魇。这绝不是寻常的安息之所。
adv.oldborder.explore.175=不要惊扰它
adv.oldborder.explore.176=你刚抬起棺盖，一个强大的身影便从棺内升起。“你竟敢惊扰惧像大师？”崔纳怒吼道，双眼闪烁着黑暗力量！
adv.oldborder.explore.177=迎战惧像大师！
adv.oldborder.explore.178=用地下室钥匙开锁
adv.oldborder.explore.179=这道闸门锁着。
adv.oldborder.explore.180=用外门钥匙开锁
adv.innistrad.opening.000=你好，鹏洛客'{'var=player_name'}'。欢迎来到我的居所。
adv.innistrad.opening.001=我为什么会在这里？
adv.innistrad.opening.002=你身处一个名为依尼翠的时空。这里恐惧与喜悦并存，黑暗与光明相伴。阴影像浓重的晨露一般，久久不散……你之所以来到这里，是因为只有你看穿了阴影，找到了我的信标……
adv.innistrad.opening.003=这里为什么像座监狱？
adv.innistrad.opening.004=和你一样，我也被囚禁在这里。不过，我能让你自由往返于我的……家……和信标所在之处，而我自己却无法离开。
adv.innistrad.opening.005=继续
adv.innistrad.opening.006=依尼翠正陷于动荡……它的灵魂扭曲变形，连自己原本的模样都已遗忘……时光与记忆交错，人们也逐渐忘记曾经发生的一切……找回那些失落的时刻，让它们重现，你或许就能找到重获自由的钥匙。
adv.innistrad.opening.007=这是什么意思？
adv.innistrad.opening.008=这需要你自己去发现……不过，先收下这枚符文。你可以随时用它返回这里。小心些，鹏洛客。在依尼翠，很少有馈赠是不求代价的。
adv.innistrad.opening.009=我还有些东西要给你，'{'var=player_name'}'。收下这些硬币，但别把它们花在普通商人那里。
adv.innistrad.opening.010=那它们是什么？有什么用？
adv.innistrad.opening.011=这些是挑战币。依尼翠逐渐破碎，一些力量汇聚之地也随之形成。法师们会趁那里的能量充沛时聚集起来，举行盛大的锦标赛。这些硬币就是入场凭证，而比赛的奖品能为你的旅程提供助力。
adv.innistrad.opening.012=这些比赛在哪里举办？
adv.innistrad.opening.013=把硬币拿给旅店老板看。如果镇上有力量汇聚之地，老板就会指引你前往那里参加比赛。
adv.innistrad.opening.014=谢谢。
adv.innistrad.opening.015=我现在会重新开启你来时的传送门，让你回到依尼翠，寻找摆脱囚禁的方法……祝你好运。
adv.innistrad.opening.016=（离开）
adv.innistrad.opening.017=我现在会重新开启你来时的传送门。回到依尼翠后，你就能寻找摆脱囚禁的方法……祝你好运。
adv.innistrad.opening.018=再见。
adv.innistrad.opening.019=谢谢。（离开）
