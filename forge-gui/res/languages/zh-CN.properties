adv.main_story_temple_of_gideon_town.266.d.n0.text=门后站着传说中的莉莲娜，似乎正专心进行某种仪式。但想接近她，得先找到镇长。
adv.main_story_temple_of_gideon_town.282.d.n0.text=莉莲娜的仪式似乎即将完成。你看见她另一侧有一扇通往领地之外的传送门。
adv.main_story_temple_of_gideon_town.282.d.n1.text=你打开大门时，她的咒语恰好吟诵至高潮，传送门两侧成堆的尸体开始站起。必须阻止她，绝不能让这支亡灵大军涌入山德拉！
adv.main_story_temple_of_liliana_bog.240.d.n0.text=一个老妇人阴恻恻地盯着你，却没有举杖攻击。
adv.main_story_temple_of_liliana_bog.240.d.n2.name=攻击女巫
adv.main_story_temple_of_liliana_bog.240.d.n3.text=“走开！休想抢走它们！”她后退一步，手里刚采来的草药和蘑菇散落了一些。
adv.main_story_temple_of_liliana_bog.240.d.n4.name=慢慢靠近她。
adv.main_story_temple_of_liliana_bog.240.d.n6.name=攻击女巫
adv.main_story_temple_of_liliana_forest.270.d.n0.text=一道大门挡在你与北面的区域之间。门上的铭文写着：“别开，死在里面。”字句排列得十分古怪。
adv.main_story_temple_of_liliana_forest.270.d.n1.text=门上挂着一把硕大而复杂的锁。
adv.main_story_temple_of_liliana_forest.270.d.n2.name=打开大门。
adv.main_story_temple_of_liliana_forest.270.d.n3.name=离开，寻找钥匙。
adv.main_story_temple_of_liliana_forest.270.d.n5.text=一道大门挡在你与北面的区域之间。门上的铭文写着：“别开，死在里面。”字句排列得十分古怪。
adv.main_story_temple_of_liliana_forest.270.d.n6.text=伴着足以惊醒死者的刺耳声响，大门缓缓开启。你可以通行了。
adv.main_story_temple_of_liliana_forest.270.d.n7.name=打开大门。
adv.main_story_temple_of_liliana_graveyard.256.d.n0.text=映水池旁矗立着一尊天使石像，姿态仿佛正在空中作战。雕像的剑与盾周围，空气中泛着七彩薄雾。换个地方，这景象会显得庄严壮丽；可在这里，只让人心生不祥。
adv.main_story_temple_of_liliana_graveyard.256.d.n10.text=雕像摧毁后，那股将你推离墓地边界的沉重力量也消失了。
adv.main_story_temple_of_liliana_graveyard.256.d.n11.name=寻找出口。
adv.main_story_temple_of_liliana_graveyard.256.d.n2.text=纪念碑散发着巨大的力量。你还注意到，基座周围那些熟悉的神圣符号，有的扭曲、有的残缺，有的被篡改——总之，都透着一股“不对劲”。
adv.main_story_temple_of_liliana_graveyard.256.d.n3.name=仔细看看雕像。
adv.main_story_temple_of_liliana_graveyard.256.d.n5.text=不管你做了什么，看来是起作用了。雕像武器周围的光芒渐渐消散，墓地周围的屏障也随之退去。你还发现自己能引导这股能量，精神为之一振。（恢复生命值 +15）
adv.main_story_temple_of_liliana_graveyard.256.d.n6.name=吸取雕像的力量。
adv.main_story_temple_of_liliana_graveyard.256.d.n7.text=雕像开始开裂、移动，却没有崩塌，而是开口怒吼：“凡人，你竟敢染指自己一无所知的力量！”你还来不及反应，它就扑了过来！
adv.main_story_temple_of_liliana_graveyard.270.d.n0.text=墙壁的嗡鸣几乎掩盖了传送门开启的声音，不过你还是注意到，左侧出现了一扇返回入口的门。
adv.main_story_temple_of_liliana_town.188.x.n0.text=已标记：巷道检查完毕。
adv.main_story_temple_of_liliana_town.188.x.n2.text=镇长似乎不在巷道里。
adv.main_story_temple_of_liliana_town.188.x.n4.text=你几乎搜遍了整个镇子，仍没找到镇长。可当你回头朝那边望去时，终于看见他出现在街上！
