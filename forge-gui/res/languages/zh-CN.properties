adv.main_story_castles_red_castle.72.d.n7.text=挑战者尚未被击败，你不得越过此门。
adv.main_story_castles_red_castle.72.d.n9.text=真令人刮目相看。你可以上楼去见我的主人了，不过我可不保证你能活着回来。
adv.main_story_castles_wastetown.55.d.n0.text=一扇巨大的门挡住了去路。
adv.main_story_castles_wastetown.55.d.n2.text=门锁已打开。
adv.main_story_castles_wastetown.55.d.n3.name=用五把彩色钥匙开锁。
adv.main_story_castles_white_castle_f1.50.x.n0.text=当你给爱若玛最后一击时，一阵强烈的法术力波动掠过全身。眼前的威胁消除后，你终于看清：大厅北端那间上锁的房间里，没有任何囚徒。
adv.main_story_castles_white_castle_f1.50.x.n2.text=当你给爱若玛最后一击时，又一阵法术力波动传来。但和之前一样，倒下的敌人身后，那间上锁的房间里没有任何囚徒。
adv.main_story_castles_white_castle.55.d.n0.text=你来到一扇门前。
adv.main_story_castles_white_castle.55.d.n1.text=一声震耳欲聋的巨响过后，大门轰然炸开，路上只剩灰烬。你可以通行了。
adv.main_story_castles_white_castle.55.d.n2.name=爱若玛，我已经照你说的做了！该结束这一切了！
adv.main_story_castles_white_castle.55.d.n4.text=一声震耳欲聋的巨响过后，大门轰然炸开，路上只剩灰烬。你可以通行了。
adv.main_story_castles_white_castle.55.d.n5.name=爱若玛，我已经照你说的做了！该结束这一切了！
adv.main_story_castles_white_castle.55.d.n7.text=你还不够格，退下！
adv.main_story_castles_white_castle.55.d.n8.name=敲门。
adv.main_story_castles_white_castle.74.d.n0.text=欢迎，'{'var=player_name'}'。爱若玛早已迫不及待地等着这一刻了。
adv.main_story_castles_white_castle.74.d.n1.text=恐怕我无权这么做。我只是强大的天使统领爱若玛的一名仆从。
adv.main_story_castles_white_castle.74.d.n2.name=是吗？那想必你不介意帮我打开眼前这扇门吧？
adv.main_story_castles_white_castle.74.d.n3.text=击败潜伏在这座地下城里的五名敌人中的至少四名，证明你的实力，才有资格觐见我伟大的主人。\n磨利武器，备好咒语，鼓起勇气。前方的考验，即使是身经百战的勇士也不能轻视。
adv.main_story_castles_white_castle.74.d.n4.name=我要怎样才能通过这扇门？
adv.main_story_castles_white_castle.74.d.n6.name=我会证明自己的实力。等我击败你的挑战者，你可要记得开门。
adv.main_story_castles_white_castle.74.d.n7.text=挑战者尚未被击败，你不得越过此门。
adv.main_story_castles_white_castle.74.d.n9.text=确实令人佩服。你可以上楼去见我的主人了，不过我可不保证你能活着回来。
adv.main_story_defend_waste_town_abandoned.76.d.n0.text=这座旧磨坊的水轮缓缓转动，吱呀作响，是附近少有的声音。轮下的水流迟缓，颜色也很古怪。
adv.main_story_defend_waste_town_abandoned.77.d.n0.text=这些商店与镇上其他地方一样毫无生气，却似乎还留着一些货物。不知过了多久，竟始终无人动过，实在可疑。
adv.main_story_defend_waste_town_abandoned.78.d.n0.text=旅店锁得严严实实，镇公所却连前门都不见了。里面没什么异常，只有整理得井井有条、却已朽坏的纸张，上面的墨迹早已模糊不清。
adv.main_story_defend_waste_town_abandoned.79.d.n0.text=爬满房屋的藤蔓病恹恹的，仿佛正在寻找这片土壤无法提供的养分。
adv.main_story_defend_waste_town_abandoned.82.d.n0.text=“死一般寂静”，用来形容这片墓地再贴切不过。你甚至有点盼着死者爬起来，好让这里发生点什么。
adv.main_story_defend_waste_town_abandoned.83.d.n0.text=正如商人所说，门后是一座空无一人的镇子。连风在这里都仿佛放轻了脚步，唯恐惊动什么。
adv.main_story_defend_waste_town_abandoned.83.d.n1.text=走近后你才发现，大多数房屋虽然还在，却早已年久失修，甚至被草木完全吞没。这里恐怕已经很久无人居住了。
adv.main_story_defend_waste_town_abandoned.83.d.n3.name=该去找传送门了。看来也没什么人能问路……
adv.main_story_defend_waste_town_abandoned.94.d.n0.text=也许只是错觉，但在这一带探索时，你始终觉得有人在盯着自己。
adv.main_story_explore_dig_site_0.61.d.n0.text=我只是来捡几块旧机器零件，没想到它们竟想把我捡走。好歹这回不是蛇……
adv.main_story_explore_dig_site_1.116.d.n0.text=杠杆牢牢固定在开关上，却能轻易来回摆动，仿佛这套机关根本没有连接任何东西。
adv.main_story_explore_frostbitten_cavern_0.30.d.n0.text=幸运的是——对你，也可能对洞里的居民而言——这扇门是被冻在开启的位置，而不是关闭的位置。
adv.main_story_explore_frostbitten_cavern_1.19.d.n0.text=洞穴的每个角落都长着花，至少也在努力生长。冰锥点缀着明亮洁白的洞顶，宛如一盏吊灯，而洞中的温度远比你想象中暖和。
adv.main_story_explore_frostbitten_cavern_1.25.d.n0.text=这朵花紫得浓艳。
adv.main_story_explore_frostbitten_cavern_1.25.d.n1.name=摘下花朵。
adv.main_story_explore_frostbitten_cavern_1.26.d.n0.text=这朵花呈现出一种浪漫的绯红色。
adv.main_story_explore_frostbitten_cavern_1.26.d.n1.name=摘下花朵。
adv.main_story_explore_frostbitten_cavern_1.8.d.n0.text=洞穴深处的法师冲你冷笑：“如果我的同伴给你的欢迎还不够冷，那就让我来……”
adv.main_story_explore_frostbitten_cavern_1.8.d.n1.text=“不行。现在，给我走开。”
adv.main_story_explore_frostbitten_cavern_1.8.d.n2.name=“我只需要其中一朵花……”
adv.main_story_explore_frostbitten_cavern_1.8.d.n3.name=（战斗）
adv.main_story_explore_frostbitten_cavern_1.8.d.n4.name=（逃跑）
adv.main_story_explore_frostbitten_cavern_1.8.d.n5.name=（战斗）
adv.main_story_explore_frostbitten_cavern_1.8.d.n6.name=（逃跑）
adv.main_story_explore_library_of_varsil_1.25.d.n0.text=这一格书架上摆放着各种普通动物的解剖学著作。最上面摊开的那本讲的是蛇。为什么偏偏是蛇？
adv.main_story_explore_library_of_varsil_1.26.d.n0.text=这格书架上摆着食谱，但许多食材你闻所未闻。
adv.main_story_explore_library_of_varsil_1.27.d.n0.text=这里与其说是书，不如说是一堆文书：商队货单、运输账簿与地图装订在一起。几张日历上写满批注和疑问，看来收集资料的人怀疑，这些商人常常沿途开展未记入账目的其他生意。
adv.main_story_explore_library_of_varsil_1.28.d.n0.text=《个人传送术对城际贸易的影响》——听起来可不像让人爱不释手的读物。
adv.main_story_explore_library_of_varsil_1.30.d.n0.text=这些书曾经记载的知识已经无从寻回。书页早已被黑色液体浸透，下方的书架似乎也染着同样的污渍。
adv.main_story_explore_library_of_varsil_1.31.d.n0.text=架上摆满了积灰的书籍，题目平平无奇。你觉得它们已经很久没人碰过了。
adv.main_story_explore_library_of_varsil_1.32.d.n0.text=一册封面结实的日志摆在书架上，与周围褪色的卷轴截然不同。不过内容用某种密码写成，你完全看不懂。
adv.main_story_explore_library_of_varsil_1.33.d.n0.text=《阿兹戈斯的仲夏晨诗》。这本书令你不寒而栗，你明智地没有翻开封面。
adv.main_story_explore_library_of_varsil_1.34.d.n0.text=这里是一批你从未听说过的法师传记。匆匆翻了几页，你不禁纳闷，究竟谁会费心写这些。
adv.main_story_explore_library_of_varsil_1.35.d.n0.text=书柜里满是孩子们的画作。与常见的儿童画不同，这里的画似乎都与奥术有关。
adv.main_story_explore_library_of_varsil_1.36.d.n0.text=你找到了一张图书馆的建筑图纸。可惜，上面似乎没有标出可供利用的秘密通道。
adv.main_story_explore_library_of_varsil_2.26.d.n0.text=《疯癫弄臣的诅咒》是一部虚构故事：名叫库图曼的男子，靠着描绘奇幻世界的翔实故事，从乞丐一跃成为宫廷艺人。后来，恶魔当着国王与满朝大臣的面把他拖走，却没有伤害在场的其他人。
adv.main_story_explore_library_of_varsil_2.26.d.n1.text=不过，这份抄本前附有抄写员的说明：文中所有重要历史人物及其交往，描写都极为准确。这让人怀疑，库图曼的故事或许并非虚构。
adv.main_story_explore_library_of_varsil_2.27.d.n0.text=书架上只有一堆散页，似乎从图书馆各处的书中脱落而来。你没发现什么特别重要的内容。
adv.main_story_explore_library_of_varsil_2.28.d.n0.text=《魔法气象学》《苍穹的毁灭之力》……这些书好像都在研究从天而降的东西。
adv.main_story_explore_library_of_varsil_2.29.d.n0.text=《与缺乏魔法天赋者相处》讨论了山德拉各地的难题：如何让没有魔法天赋的人也觉得，自己是能够为社会作出贡献的一员。
adv.main_story_explore_library_of_varsil_2.30.d.n0.text=架上堆着一摞儿童读物。最上面那本讲述鬼怪气球队的故事：队员们都没有名字，彼此只称作“比 X 个笨”，其中 X 是大家当天公认比他聪明的队友人数。
adv.main_story_explore_library_of_varsil_2.31.d.n0.text=家谱与人口普查资料占满了这座书柜。这些东西积了厚厚一层灰，倒也不奇怪；正因如此，几本书最近才被抽走的痕迹格外显眼。
adv.main_story_explore_library_of_varsil_2.32.d.n0.text=你找到一本研究精灵生理的书。有一页折了角，上面介绍的一种精灵，你在山德拉从未见过。
adv.main_story_explore_library_of_varsil_2.34.d.n0.text=《沿海劫掠纪事》收录了对一座海滨渔村幸存者的访谈。据他们所说，一群不明生物径直从海中走上岸，洗劫了村庄。
adv.main_story_explore_library_of_varsil_2.35.d.n0.text=这里收集了各种关于法术力碎片的著述：既有它们在地下吸收法术力的理论，也有充满想象的图画，比如一座建在干涸河床旁、靠碎片而非水力运转的磨坊。
adv.main_story_explore_library_of_varsil_2.36.d.n0.text=《魔法的代价》关注的并非咒语本身的效果，而是施法的成本与后果。这本书不怎么受欢迎。
adv.main_story_explore_library_of_varsil_2.38.d.n0.text=《消失的猞猁》似乎在比较家养猫科动物与狮族的生理和行为。书中提出种种理论，最终认定：两者之中必有一方，是古代法师的研究遭到误用后的产物。
adv.main_story_explore_library_of_varsil_3.26.d.n0.text=《山德拉最易燃的城市》。嗯，这本读起来大概很“火热”……
adv.main_story_explore_library_of_varsil_3.27.d.n0.text=这里是一批你从未听说过的法师传记。他们似乎都没干过什么值得记述的事。
adv.main_story_explore_library_of_varsil_3.28.d.n0.text=这里收录了士兵的日记，年代相近，却来自几支不同的军队。把它们放在一起，似乎就能拼出几场共同经历的战役的完整图景。
adv.main_story_explore_library_of_varsil_3.30.d.n0.text=《精妙反击咒语的艺术》很有参考价值，前提是你有时间仔细研读。
adv.main_story_explore_library_of_varsil_3.31.d.n0.text=这里收集着商队货单。内容看起来平平无奇，但有人圈出了几项货物，还写了批注；字迹潦草得几乎无法辨认。
adv.main_story_explore_library_of_varsil_3.32.d.n0.text=《论所有文明国度所面临的迫切威胁》——对于一份侦察报告，这标题实在冗长，不过内容确实如此。
adv.main_story_explore_library_of_varsil_3.32.d.n1.text=以这座图书馆的标准来看，这份报告还算新。它记载了一座裂片妖巢穴，规模大得连山德拉最大的城市都相形见绌，附有详细的位置地图。
adv.main_story_explore_library_of_varsil_3.32.d.n3.name=（放下报告）
adv.main_story_explore_library_of_varsil_3.32.d.n4.text=你在地图上标记了斯凯普巢穴的位置，留待日后调查。
adv.main_story_explore_library_of_varsil_3.32.d.n5.name=说不定还在那里？记下这个地点吧。
adv.main_story_explore_library_of_varsil_3.34.d.n0.text=这里是一批你从未听说过的法师传记。他们似乎都没干过什么值得记述的事。
adv.main_story_explore_library_of_varsil_3.35.d.n0.text=这里收集了各种鬼怪发明的设计图副本。抄录者在旁边逐一评级，范围从“肯定会炸”到“烂得连炸都炸不起来”。
adv.main_story_explore_library_of_varsil_3.36.d.n0.text=《如何驯养你的獾》，作者绿袖……到底是题材更荒唐，还是这个笔名更荒唐？
adv.main_story_explore_library_of_varsil_3.37.d.n0.text=《帕迪克热恋》竟然是一本爱情小说，讲述了一对命运多舛的法师如何擦出爱的火花。
adv.main_story_explore_library_of_varsil_3.50.d.n0.text=《拟态怪的常见形态》本该是一本实用的书——如果它没那么执着于把你吃掉的话。
adv.main_story_explore_library_of_varsil_3.51.d.n0.text=“……s35 始终坚持自己此前从未被召唤过。然而，当第七阶段开始时，s35 的不适症状有所减轻；而在第十二阶段，当我们召来 s36 时，s35 似乎至少在潜意识中预见到了即将到来的危险……”
adv.main_story_explore_library_of_varsil_3.51.d.n1.text=这似乎就是你要找的研究资料。
adv.main_story_explore_library_of_varsil_3.51.d.n3.text=这里或许还藏着更多东西，不过你已经拿到了多诺万爵士要的资料，可以原路离开了。
adv.main_story_explore_library_of_varsil_3.51.d.n4.name=拿走文件。
adv.main_story_explore_library_of_varsil_3.51.d.n6.text=楼上那台巨型机械已经被击败，你在这里的工作完成了。
adv.main_story_explore_library_of_varsil_3.51.d.n7.name=拿走文件。
adv.main_story_explore_library_of_varsil_4.27.x.n0.text=这台怪物般的机器已经停摆，剩下那些相对小一些的同伴，可以留给实力稍弱的冒险者处理。不过你还没找到多诺万爵士要的文件，东西一定在楼下。
adv.main_story_explore_library_of_varsil_4.27.x.n2.text=这台怪物般的机器已经停摆，剩下那些相对小一些的同伴，可以留给实力稍弱的冒险者处理。你已找到多诺万爵士要的文件，现在就能回去复命，也可以先到楼下继续探索。
adv.main_story_explore_library_of_varsil_4.28.x.n0.text=这台怪物般的机器已经停摆，剩下那些相对小一些的同伴，可以留给实力稍弱的冒险者处理。不过你还没找到多诺万爵士要的文件，东西一定在楼下。
adv.main_story_explore_library_of_varsil_4.28.x.n2.text=这台怪物般的机器已经停摆，剩下那些相对小一些的同伴，可以留给实力稍弱的冒险者处理。你已找到多诺万爵士要的文件，现在就能回去复命，也可以先到楼下继续探索。
adv.main_story_explore_library_of_varsil_4.29.x.n0.text=这台怪物般的机器已经停摆，剩下那些相对小一些的同伴，可以留给实力稍弱的冒险者处理。不过你还没找到多诺万爵士要的文件，东西一定在楼下。
adv.main_story_explore_library_of_varsil_4.29.x.n2.text=这台怪物般的机器已经停摆，剩下那些相对小一些的同伴，可以留给实力稍弱的冒险者处理。你已找到多诺万爵士要的文件，现在就能回去复命，也可以先到楼下继续探索。
adv.main_story_explore_library_of_varsil_4.33.d.n0.text=要从满地撕碎的书页里找出有用信息，恐怕只能靠那些还记得原书内容的学者了。你走近时，这里的传送门开启了，可以让你迅速返回入口。
adv.main_story_explore_library_of_varsil_4.35.d.n0.text=眼前这尊构装体，是你见过最庞大的之一。它与下层那些魔像不同，并不怎么模仿人形，而是有着独特的构造。
adv.main_story_explore_library_of_varsil_4.35.d.n1.text=机器后面散落着许多残破的书，显然都是从下方书架取出后撕碎的。
adv.main_story_explore_library_of_varsil_4.35.d.n3.text=（注意：这是一场难度较高的可选遭遇战。）
adv.main_story_plains_capital.64.d.n0.text=你好。这里暂时没有需要你做的事……\n暂时而已。
adv.main_story_spawn.69.d.n0.text=你好，鹏洛客 '{'var=player_name'}'。
adv.main_story_spawn.69.d.n1.text=这里……是山德拉。这个时空的法术力无处不在，所有有灵智的生物都会运用它。就连普通人，每天也会施放咒语。
adv.main_story_spawn.69.d.n11.text=这些是挑战币。山德拉的施法者常常聚在一起切磋技艺。用这些钱币就能报名，赢得的奖品会为你的旅程提供帮助。
adv.main_story_spawn.69.d.n12.name=那是什么？有什么用？
adv.main_story_spawn.69.d.n13.text=把钱币出示给旅店老板。如果镇上有对应的团体，老板就会为你指路。
adv.main_story_spawn.69.d.n14.name=这些比赛在哪里举行？
adv.main_story_spawn.69.d.n15.text=我现在会重新打开你来时的传送门，但它无法送你回原来的地方。门的另一边是山德拉的荒地——我的家，也是你如今的归处。
adv.main_story_spawn.69.d.n16.name=谢谢。
adv.main_story_spawn.69.d.n17.name=（离开）
adv.main_story_spawn.69.d.n18.text=我现在会重新打开你来时的传送门，但它无法送你回原来的地方。门的另一边是山德拉的荒地——我的家，也是你如今的归处。
adv.main_story_spawn.69.d.n19.name=谢谢。
adv.main_story_spawn.69.d.n2.name=我为什么会在这里？
adv.main_story_spawn.69.d.n20.name=（离开）
adv.main_story_spawn.69.d.n21.name=再见。
adv.main_story_spawn.69.d.n22.text=“'{'var=player_name'}'！我感觉守护者的法术正在减弱！击败他们所有人，你也许还能救我们。”
adv.main_story_spawn.69.d.n23.name=“再见。”
adv.main_story_spawn.69.d.n24.text=“很高兴再次见到你，'{'var=player_name'}'。看来你的任务有些进展了？”
adv.main_story_spawn.69.d.n25.text=“看来我应该解释得更清楚些。你击败的守护者并非囚禁他们的人，至少不直接负责看守。但仅仅是他们的存在，就足以影响整个世界。”
adv.main_story_spawn.69.d.n26.name=“我击败了五座城堡里的敌人，却没找到任何囚徒。”
adv.main_story_spawn.69.d.n27.text=“在他们的城堡里，你大概已经见识过这种力量集中的表现。但他们也遮蔽了世界上的某些区域，让那些地方……用通俗的话说，就是‘藏了起来’。”
adv.main_story_spawn.69.d.n28.name=“什么影响？”
adv.main_story_spawn.69.d.n29.text=“他们共同构成的法术，会微妙地欺骗心智，让我们对世界的某些部分视而不见。真正关押鹏洛客的牢狱也在其中。我想，你现在应该能找到那些地方了……”
adv.main_story_spawn.69.d.n3.text=有些鹏洛客与你一样，被城堡里的守护者困在了这里。你必须在战斗中击败他们，才能让我们摆脱这个时空的囚禁。用你的魔法力量挑战他们吧。
adv.main_story_spawn.69.d.n31.text=[RED]开发者说明：[]你已体验完目前开放的剧情内容，但山德拉仍有更多事物等待探索。世界地图上已新增几处高难度地下城，你也可以继续扩充自己的卡牌收藏。
adv.main_story_spawn.69.d.n33.text=[RED]开发者说明：[]后续剧情推出后，更新 Forge 并再次与这位 NPC 交谈即可继续。汉化版更新动态可关注 QQ 群：813597628。感谢你与我们一同踏上这场冒险！
adv.main_story_spawn.69.d.n35.name=（第一章完成）
adv.main_story_spawn.69.d.n36.text=又见面了。
adv.main_story_spawn.69.d.n37.name=用五把彩色钥匙，换一枚自选玛珂和伊莫库房间的钥匙。
adv.main_story_spawn.69.d.n5.text=找到被困在这里的鹏洛客，带他们来见我。他们会助你完成旅程。
adv.main_story_spawn.69.d.n7.text=拿着这枚符文。你随时可以用它回到这里。小心行事，鹏洛客。
adv.main_story_spawn.69.d.n9.text=我还有些东西要交给你，'{'var=player_name'}'。拿好这些钱币，但别拿去找商人花掉。
adv.main_story_temple_of_gideon_graveyard.256.d.n0.text=映水池旁矗立着一尊天使石像，姿态仿佛正在空中作战。雕像的剑与盾周围，空气中泛着七彩薄雾。换个地方，这景象会显得庄严壮丽；可在这里，只让人心生不祥。
adv.main_story_temple_of_gideon_graveyard.256.d.n10.text=雕像摧毁后，那股将你推离墓地边界的沉重力量也消失了。
adv.main_story_temple_of_gideon_graveyard.256.d.n11.name=寻找出口。
adv.main_story_temple_of_gideon_graveyard.256.d.n2.text=纪念碑散发着巨大的力量。你还注意到，基座周围那些熟悉的神圣符号，有的扭曲、有的残缺，有的被篡改——总之，都透着一股“不对劲”。
adv.main_story_temple_of_gideon_graveyard.256.d.n3.name=仔细看看雕像。
adv.main_story_temple_of_gideon_graveyard.256.d.n5.text=不管你做了什么，看来是起作用了。雕像武器周围的光芒渐渐消散，墓地周围的屏障也随之退去。你还发现自己能引导这股能量，精神为之一振。（恢复生命值 +15）
adv.main_story_temple_of_gideon_graveyard.256.d.n6.name=吸取雕像的力量。
adv.main_story_temple_of_gideon_graveyard.256.d.n7.text=雕像开始开裂、移动，却没有崩塌，而是开口怒吼：“凡人，你竟敢染指自己一无所知的力量！”你还来不及反应，它就扑了过来！
adv.main_story_temple_of_gideon_steppe.237.d.n0.text=你走进门内。
adv.main_story_temple_of_gideon_steppe.237.d.n1.text=一阵赤焰卷过，大门燃烧殆尽，路上只剩灰烬。你可以通行了。
adv.main_story_temple_of_gideon_steppe.237.d.n2.name=拉黎丝，该结束这一切了！
adv.main_story_temple_of_gideon_steppe.237.d.n4.text=你还不够格，退下！
adv.main_story_temple_of_gideon_steppe.237.d.n5.name=敲门。
adv.main_story_temple_of_gideon_steppe.240.d.n0.text=一个老妇人阴恻恻地盯着你，却没有举杖攻击。
adv.main_story_temple_of_gideon_steppe.240.d.n2.name=攻击女巫
adv.main_story_temple_of_gideon_steppe.240.d.n3.text=“走开！休想抢走它们！”她后退一步，手里刚采来的草药和蘑菇散落了一些。
adv.main_story_temple_of_gideon_steppe.240.d.n4.name=慢慢靠近她。
adv.main_story_temple_of_gideon_steppe.240.d.n6.name=攻击女巫
adv.main_story_temple_of_gideon_town.188.x.n0.text=已标记：巷道检查完毕。
